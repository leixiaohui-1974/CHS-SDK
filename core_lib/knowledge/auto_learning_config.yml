# CHS-SDK 知识库自动学习系统配置
# 该配置文件定义了自动监控和学习项目代码变更的各项参数

# 基础配置
base:
  # 项目根目录（相对于配置文件）
  project_root: "../../"
  
  # 启用自动学习
  enabled: true
  
  # 学习模式：'realtime'（实时）, 'batch'（批处理）, 'scheduled'（定时）
  learning_mode: "realtime"
  
  # 日志级别
  log_level: "INFO"

# 文件监控配置
file_monitoring:
  # 监控的文件模式
  monitor_patterns:
    - "*.py"          # Python 代码文件
    - "*.yml"         # YAML 配置文件
    - "*.yaml"        # YAML 配置文件
    - "*.md"          # Markdown 文档
    - "*.txt"         # 文本文件
    - "*.json"        # JSON 配置文件
    - "*.toml"        # TOML 配置文件
    - "*.ini"         # INI 配置文件
  
  # 忽略的文件和目录模式
  ignore_patterns:
    - "__pycache__"    # Python 缓存目录
    - ".git"          # Git 目录
    - ".vscode"       # VS Code 配置
    - ".idea"         # PyCharm 配置
    - "node_modules"   # Node.js 模块
    - "*.pyc"         # Python 编译文件
    - "*.pyo"         # Python 优化文件
    - "*.pyd"         # Python 动态库
    - "*.so"          # 共享库
    - "*.dll"         # 动态链接库
    - "*.exe"         # 可执行文件
    - "*.log"         # 日志文件
    - "*.tmp"         # 临时文件
    - "*.cache"       # 缓存文件
    - ".pytest_cache" # Pytest 缓存
    - "dist/"         # 分发目录
    - "build/"        # 构建目录
    - "*.egg-info/"   # Python 包信息
  
  # 最大文件大小（字节）
  max_file_size: 10485760  # 10MB
  
  # 监控深度（目录层级）
  max_depth: 10

# 变更处理配置
change_processing:
  # 批处理大小
  batch_size: 10
  
  # 处理间隔（秒）
  processing_interval: 5.0
  
  # 防抖时间（秒）- 避免频繁变更触发多次处理
  debounce_time: 2.0
  
  # 最大工作线程数
  max_workers: 4
  
  # 处理超时时间（秒）
  processing_timeout: 30
  
  # 重试次数
  max_retries: 3
  
  # 重试间隔（秒）
  retry_interval: 1.0

# 智能学习配置
intelligent_learning:
  # 启用智能分析
  enable_smart_analysis: true
  
  # 相似度阈值（用于判断文件变更的重要性）
  similarity_threshold: 0.1
  
  # 学习权重配置
  learning_weights:
    code_changes: 1.0      # 代码变更权重
    config_changes: 0.8    # 配置变更权重
    doc_changes: 0.6       # 文档变更权重
    test_changes: 0.7      # 测试文件变更权重
  
  # 自动分类规则
  auto_classification:
    agents:
      patterns: ["**/agents/**", "**/agent_*.py", "**/*_agent.py"]
      weight: 1.0
    
    configs:
      patterns: ["**/config/**", "*.yml", "*.yaml", "*.json", "*.toml"]
      weight: 0.8
    
    scenarios:
      patterns: ["**/scenarios/**", "**/scenario_*.py", "**/*_scenario.py"]
      weight: 0.9
    
    documentation:
      patterns: ["**/docs/**", "*.md", "*.rst", "*.txt"]
      weight: 0.6
    
    tests:
      patterns: ["**/tests/**", "**/test_*.py", "**/*_test.py"]
      weight: 0.7

# Git 集成配置
git_integration:
  # 启用 Git 集成
  enabled: true
  
  # 自动提交变更
  auto_commit: false
  
  # 提交消息模板
  commit_message_template: "Auto-update knowledge base: {file_count} files processed"
  
  # 监控的分支
  monitored_branches: ["main", "master", "develop"]
  
  # 同步间隔（秒）
  sync_interval: 300  # 5分钟
  
  # 忽略的提交类型
  ignore_commit_patterns:
    - "^Merge"
    - "^Revert"
    - "^Auto-update"

# 索引配置
indexing:
  # 增量索引
  incremental_indexing: true
  
  # 全量重建间隔（小时）
  full_rebuild_interval: 24
  
  # 索引优化间隔（小时）
  optimization_interval: 6
  
  # 并行索引
  parallel_indexing: true
  
  # 索引缓存大小
  cache_size: 1000
  
  # 索引压缩
  enable_compression: true

# 语义搜索配置
semantic_search:
  # 自动更新嵌入
  auto_update_embeddings: true
  
  # 嵌入更新阈值
  embedding_update_threshold: 0.05
  
  # 批量嵌入大小
  batch_embedding_size: 32
  
  # 嵌入缓存
  enable_embedding_cache: true
  
  # 缓存过期时间（小时）
  cache_expiry_hours: 48

# 推荐系统配置
recommendation_system:
  # 自动更新推荐模型
  auto_update_model: true
  
  # 模型更新间隔（小时）
  model_update_interval: 12
  
  # 推荐缓存大小
  recommendation_cache_size: 500
  
  # 最小训练样本数
  min_training_samples: 10
  
  # 推荐多样性权重
  diversity_weight: 0.3

# 性能配置
performance:
  # 内存限制（MB）
  memory_limit: 512
  
  # CPU 使用限制（百分比）
  cpu_limit: 80
  
  # 磁盘使用限制（MB）
  disk_limit: 1024
  
  # 性能监控间隔（秒）
  monitoring_interval: 60
  
  # 自动垃圾回收
  auto_gc: true
  
  # GC 间隔（秒）
  gc_interval: 300

# 通知配置
notifications:
  # 启用通知
  enabled: true
  
  # 通知级别：'error', 'warning', 'info', 'debug'
  level: "warning"
  
  # 通知方式
  methods:
    console: true
    file: true
    webhook: false
  
  # 文件通知配置
  file_notification:
    log_file: "logs/auto_learning.log"
    max_size: 10485760  # 10MB
    backup_count: 5
  
  # Webhook 通知配置
  webhook_notification:
    url: ""
    timeout: 10
    retry_count: 3

# 安全配置
security:
  # 启用安全检查
  enabled: true
  
  # 文件权限检查
  check_file_permissions: true
  
  # 路径遍历保护
  prevent_path_traversal: true
  
  # 最大文件数量限制
  max_files_per_batch: 100
  
  # 敏感文件模式（不会被处理）
  sensitive_patterns:
    - "*.key"
    - "*.pem"
    - "*.p12"
    - "*.pfx"
    - "*password*"
    - "*secret*"
    - "*token*"
    - ".env*"

# 调试配置
debug:
  # 启用调试模式
  enabled: false
  
  # 详细日志
  verbose_logging: false
  
  # 性能分析
  enable_profiling: false
  
  # 统计信息收集
  collect_stats: true
  
  # 统计信息保存间隔（秒）
  stats_save_interval: 300
  
  # 调试输出目录
  debug_output_dir: "debug/auto_learning"

# 实验性功能
experimental:
  # 启用机器学习优化
  enable_ml_optimization: false
  
  # 自适应学习率
  adaptive_learning_rate: false
  
  # 预测性索引
  predictive_indexing: false
  
  # 智能缓存策略
  smart_caching: false
  
  # 分布式处理
  distributed_processing: false

# 集成配置
integrations:
  # IDE 集成
  ide:
    # 实时通知 IDE
    notify_ide: true
    
    # IDE 通信端口
    communication_port: 8765
    
    # 支持的 IDE
    supported_ides: ["vscode", "pycharm", "trae"]
  
  # API 集成
  api:
    # 启用 API 服务
    enabled: true
    
    # API 端口
    port: 8766
    
    # API 认证
    require_auth: false
    
    # API 密钥
    api_key: ""
  
  # 外部工具集成
  external_tools:
    # Elasticsearch
    elasticsearch:
      enabled: false
      host: "localhost"
      port: 9200
      index: "chs_knowledge"
    
    # Redis 缓存
    redis:
      enabled: false
      host: "localhost"
      port: 6379
      db: 0
    
    # 消息队列
    message_queue:
      enabled: false
      type: "rabbitmq"  # 'rabbitmq', 'kafka', 'redis'
      host: "localhost"
      port: 5672
      queue: "chs_learning"