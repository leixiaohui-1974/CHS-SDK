api_interface:
  authentication:
    api_key: null
    enabled: false
    jwt:
      algorithm: HS256
      expiry_hours: 24
      secret_key: null
  caching:
    enabled: true
    max_entries: 1000
    ttl: 300
  cors:
    credentials: true
    enabled: true
    headers:
    - '*'
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    origins:
    - '*'
  rate_limiting:
    enabled: false
    requests_per_hour: 1000
    requests_per_minute: 100
  server:
    host: localhost
    port: 8080
    timeout: 30
    workers: 1
auto_learning:
  enabled: true
  file_monitoring:
    ignore_patterns:
    - __pycache__
    - .git
    - .vscode
    - node_modules
    - '*.pyc'
    max_file_size: 10485760
    patterns:
    - '*.py'
    - '*.yml'
    - '*.yaml'
    - '*.md'
    - '*.txt'
    - '*.json'
  git_integration:
    auto_commit: false
    enabled: true
    sync_interval: 300
  intelligent_learning:
    similarity_threshold: 0.1
    weights:
      code_changes: 1.0
      config_changes: 0.8
      doc_changes: 0.6
      test_changes: 0.7
  mode: realtime
  processing:
    batch_size: 10
    debounce_time: 2.0
    interval: 5.0
    max_workers: 4
experimental:
  auto_optimization:
    enabled: false
    optimization_interval: 24
  federated_learning:
    coordination_server: null
    enabled: false
  graph_neural_network:
    enabled: false
    model_path: null
  multimodal_search:
    enabled: false
    image_embedding_model: null
integration:
  external_tools:
    documentation:
      auto_generate: false
      enabled: true
    git:
      enabled: true
      track_changes: true
    testing:
      auto_test_recommendations: false
      enabled: true
  ide:
    plugin:
      auto_start_api: true
      intelligent_suggestions: true
      real_time_indexing: true
    supported_ides:
    - vscode
    - trae
    - pycharm
  llm:
    api:
      auto_citation: true
      knowledge_enhancement: true
      max_context_length: 4000
    supported_models:
    - openai
    - claude
    - local
knowledge_base:
  auto_initialize: true
  debug_mode: false
  enabled: true
  project_root: ../../
  storage_path: knowledge_base
knowledge_indexer:
  file_scanning:
    exclude_dirs:
    - __pycache__
    - .git
    - .vscode
    - node_modules
    - venv
    - env
    - .pytest_cache
    - build
    - dist
    exclude_patterns:
    - '*.pyc'
    - '*.pyo'
    - '*.pyd'
    - '*.log'
    - '*.tmp'
    max_file_size: 10
    supported_file_types:
    - .py
    - .yml
    - .yaml
    - .md
    - .txt
    - .json
  indexing:
    auto_index_interval: 30
    batch_size: 100
    change_detection:
      check_mtime: true
      hash_algorithm: md5
      use_file_hash: true
    incremental_indexing: true
  special_paths:
    agent_registry_path: core_lib
    config_templates_path: scenarios/templates
    documentation_path: docs
    examples_path: examples
logging:
  console:
    enabled: true
    level: INFO
  file:
    backup_count: 5
    enabled: true
    max_size: 10
    path: logs/knowledge_base.log
    rotation: daily
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
monitoring:
  alerts:
    enabled: false
    notifications:
    - log
    thresholds:
      error_rate: 0.1
      memory_usage: 0.9
      response_time: 5.0
  health_check:
    checks:
    - api_server
    - vector_db
    - embedding_model
    - file_system
    enabled: true
    interval: 30
  performance:
    enabled: true
    interval: 60
    metrics:
    - response_time
    - memory_usage
    - cpu_usage
    - search_accuracy
    - recommendation_quality
performance:
  cache:
    recommendation_cache_size: 500
    search_cache_size: 1000
    vector_cache_size: 10000
  concurrency:
    async_queue_size: 100
    max_concurrent_tasks: 10
    thread_pool_size: 4
  memory:
    auto_gc: true
    max_memory_mb: 2048
    warning_threshold: 0.8
recommendation_engine:
  algorithms:
    collaborative_filtering:
      enabled: true
      min_interactions: 3
      similarity_threshold: 0.5
    content_based:
      enabled: true
      feature_weights:
        content_similarity: 0.4
        doc_type: 0.2
        file_type: 0.1
        tags: 0.3
    context_based:
      context_weights:
        current_file: 0.4
        project_structure: 0.3
        recent_files: 0.3
      enabled: true
  recommendation_params:
    confidence_threshold: 0.2
    default_count: 5
    diversity_factor: 0.3
    max_count: 20
  usage_history:
    auto_cleanup: true
    expiry_days: 90
    max_records: 10000
    storage_path: knowledge_base/usage_history.json
security:
  access_control:
    admin_permissions:
    - read
    - write
    - admin
    default_permissions:
    - read
    enabled: false
  audit:
    enabled: false
    log_path: logs/audit.log
    logged_operations:
    - search
    - recommend
    - index_rebuild
    - configuration_change
  encryption:
    algorithm: AES-256
    enabled: false
    key_management: local
semantic_search:
  embedding_model:
    batch_size: 32
    cache_dir: models/embeddings
    device: auto
    max_seq_length: 512
    name: sentence-transformers/all-MiniLM-L6-v2
  search_params:
    default_top_k: 10
    hybrid_weights:
    - 0.7
    - 0.3
    max_top_k: 50
    similarity_threshold: 0.1
  vector_db:
    batch_size: 1000
    dimension: 384
    hnsw_params:
      M: 16
      efConstruction: 200
      efSearch: 50
    index_type: HNSW
    path: knowledge_base/vectors
