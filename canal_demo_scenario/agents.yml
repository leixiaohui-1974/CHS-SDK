# 渠道控制系统智能体配置
agents:
  # 渠道1水位感知智能体
  - id: "Canal1_Level_Sensor"
    class: "core_lib.local_agents.perception.digital_twin_agent.DigitalTwinAgent"
    config:
      simulated_object_id: "Canal_1"
      target_variable: "water_level"
      measurement_noise:
        enable: true
        std_dev: 0.05  # 5cm测量噪声
      publish_topic: "sensor/canal1/water_level"
      update_frequency: 1.0  # 1Hz更新频率

  # 渠道2水位感知智能体
  - id: "Canal2_Level_Sensor"
    class: "core_lib.local_agents.perception.digital_twin_agent.DigitalTwinAgent"
    config:
      simulated_object_id: "Canal_2"
      target_variable: "water_level"
      measurement_noise:
        enable: true
        std_dev: 0.05  # 5cm测量噪声
      publish_topic: "sensor/canal2/water_level"
      update_frequency: 1.0  # 1Hz更新频率

  # 闸门1 PID控制器
  - id: "Gate1_PID_Controller"
    class: "core_lib.local_agents.control.pid_controller.PIDController"
    config:
      controlled_id: "Gate_1"
      observed_id: "Canal_1"
      observation_key: "water_level"
      target_value: 10.0  # 目标水位10米
      pid_parameters:
        kp: 2.0    # 比例增益
        ki: 0.5    # 积分增益
        kd: 0.1    # 微分增益
        output_limits: [0.0, 1.0]  # 输出限制0-100%
        anti_windup: true
      subscribe_topic: "sensor/canal1/water_level"
      publish_topic: "control/gate1/opening_command"
      control_frequency: 1.0  # 1Hz控制频率

  # 闸门2 PID控制器
  - id: "Gate2_PID_Controller"
    class: "core_lib.local_agents.control.pid_controller.PIDController"
    config:
      controlled_id: "Gate_2"
      observed_id: "Canal_2"
      observation_key: "water_level"
      target_value: 8.0   # 目标水位8米
      pid_parameters:
        kp: 1.8    # 比例增益
        ki: 0.4    # 积分增益
        kd: 0.08   # 微分增益
        output_limits: [0.0, 1.0]  # 输出限制0-100%
        anti_windup: true
      subscribe_topic: "sensor/canal2/water_level"
      publish_topic: "control/gate2/opening_command"
      control_frequency: 1.0  # 1Hz控制频率

  # 流量监测智能体
  - id: "Flow_Monitor"
    class: "core_lib.local_agents.utility.topic_logger_agent.TopicLoggerAgent"
    config:
      topic_to_log: "simulation/flow_rates"
      log_interval: 10.0  # 每10秒记录一次
      log_format: "csv"
      output_file: "flow_monitoring.csv"

  # 水位监测智能体
  - id: "Level_Monitor"
    class: "core_lib.local_agents.utility.topic_logger_agent.TopicLoggerAgent"
    config:
      topic_to_log: "simulation/water_levels"
      log_interval: 10.0  # 每10秒记录一次
      log_format: "csv"
      output_file: "level_monitoring.csv"

  # 控制性能评估智能体
  - id: "Control_Performance_Evaluator"
    class: "core_lib.local_agents.supervisory.emergency_agent.EmergencyAgent"
    config:
      monitored_components:
        - "Canal_1"
        - "Canal_2"
      performance_metrics:
        - "water_level_deviation"
        - "control_overshoot"
        - "settling_time"
      alert_thresholds:
        water_level_deviation: 0.5  # 水位偏差超过0.5米报警
        control_overshoot: 0.2      # 超调超过20%报警
      evaluation_frequency: 30.0    # 每30秒评估一次
      publish_topic: "alerts/control_performance"

  # 扰动模拟智能体 - 模拟降雨入流
  - id: "Rainfall_Disturbance"
    class: "core_lib.disturbances.rainfall_agent.RainfallAgent"
    config:
      topic: "disturbance/rainfall/inflow"
      start_time: 1800.0    # 30分钟后开始降雨
      duration: 600.0       # 持续10分钟
      inflow_rate: 15.0     # 降雨入流量15m³/s
      target_components:
        - "Upstream_Reservoir"
      rainfall_patterns:
        base_pattern:
          type: "constant"
          intensity: 10.0   # 基础降雨强度10mm/h
        random_component:
          enable: true
          distribution: "normal"
          mean: 0.0
          std_dev: 2.0      # 随机扰动标准差2mm/h
      publish_config:
        frequency: 60.0     # 每分钟更新一次
        topics:
          - "disturbance/rainfall/upstream"

  # 用水需求扰动智能体
  - id: "Water_Demand_Disturbance"
    class: "core_lib.disturbances.water_use_agent.WaterUseAgent"
    config:
      topic: "disturbance/water_use"
      start_time: 2400.0    # 40分钟后开始
      duration: 1200.0      # 持续20分钟
      demand_rate: 8.0      # 需水量8m³/s
      target_components:
        - "Diversion_1"
        - "Diversion_2"
      demand_patterns:
        daily_pattern:
          type: "step"
          base_demand:
            Diversion_1: 5.0  # 农业灌溉基准需水5m³/s
            Diversion_2: 3.0  # 工业用水基准需水3m³/s
        random_fluctuation:
          enable: true
          distribution: "normal"
          std_dev: 0.5       # 10%随机波动
      publish_config:
        frequency: 60.0      # 每分钟更新一次
        topics:
          - "disturbance/diversion_1"
          - "disturbance/diversion_2"
