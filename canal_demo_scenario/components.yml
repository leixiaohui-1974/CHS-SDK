# 渠道控制系统组件配置
components:
  # 上游水库
  - id: "Upstream_Reservoir"
    class: "core_lib.physical_objects.reservoir.Reservoir"
    config:
      initial_state:
        water_level: 15.0  # 初始水位15米
        storage: 500000    # 初始库容50万立方米
      parameters:
        surface_area: 100000  # 水面面积10万平方米
        max_capacity: 1000000 # 最大库容100万立方米
        min_level: 5.0        # 最低水位5米
        max_level: 20.0       # 最高水位20米
        evaporation_rate: 0.001  # 蒸发率
        seepage_rate: 0.0005     # 渗漏率

  # 渠道1 - 主渠道
  - id: "Canal_1"
    class: "core_lib.physical_objects.unified_canal.UnifiedCanal"
    config:
      initial_state:
        water_level: 10.0  # 初始水位10米
        flow_rate: 50.0    # 初始流量50m³/s
      parameters:
        length: 5000       # 渠道长度5公里
        width: 20.0        # 渠道宽度20米
        depth: 8.0         # 渠道深度8米
        slope: 0.001       # 渠道坡度0.1%
        roughness: 0.025   # 糙率系数
        cross_section_type: "trapezoidal"
        side_slope: 1.5    # 边坡系数

  # 闸门1 - 控制渠道1流量
  - id: "Gate_1"
    class: "core_lib.physical_objects.gate.Gate"
    config:
      initial_state:
        opening: 0.3       # 初始开度30%
        upstream_level: 10.0
        downstream_level: 8.0
        outflow: 30.0      # 初始出流30m³/s
      parameters:
        width: 5.0         # 闸门宽度5米
        height: 6.0        # 闸门高度6米
        discharge_coefficient: 0.8  # 流量系数
        max_opening: 1.0   # 最大开度100%
        min_opening: 0.0   # 最小开度0%
        opening_rate: 0.1  # 开度变化率0.1/s

  # 渠道2 - 分水渠道
  - id: "Canal_2"
    class: "core_lib.physical_objects.unified_canal.UnifiedCanal"
    config:
      initial_state:
        water_level: 8.0   # 初始水位8米
        flow_rate: 20.0    # 初始流量20m³/s
      parameters:
        length: 3000       # 渠道长度3公里
        width: 15.0        # 渠道宽度15米
        depth: 6.0         # 渠道深度6米
        slope: 0.0008      # 渠道坡度0.08%
        roughness: 0.03    # 糙率系数
        cross_section_type: "trapezoidal"
        side_slope: 1.2    # 边坡系数

  # 闸门2 - 控制渠道2流量
  - id: "Gate_2"
    class: "core_lib.physical_objects.gate.Gate"
    config:
      initial_state:
        opening: 0.4       # 初始开度40%
        upstream_level: 8.0
        downstream_level: 6.0
        outflow: 15.0      # 初始出流15m³/s
      parameters:
        width: 4.0         # 闸门宽度4米
        height: 5.0        # 闸门高度5米
        discharge_coefficient: 0.75  # 流量系数
        max_opening: 1.0   # 最大开度100%
        min_opening: 0.0   # 最小开度0%
        opening_rate: 0.08 # 开度变化率0.08/s

  # 下游水库
  - id: "Downstream_Reservoir"
    class: "core_lib.physical_objects.reservoir.Reservoir"
    config:
      initial_state:
        water_level: 6.0   # 初始水位6米
        storage: 200000    # 初始库容20万立方米
      parameters:
        surface_area: 50000   # 水面面积5万平方米
        max_capacity: 500000  # 最大库容50万立方米
        min_level: 2.0        # 最低水位2米
        max_level: 12.0       # 最高水位12米
        evaporation_rate: 0.001  # 蒸发率
        seepage_rate: 0.0008     # 渗漏率

  # 分水口1 - 农业灌溉
  - id: "Diversion_1"
    class: "core_lib.physical_objects.valve.Valve"
    config:
      initial_state:
        opening: 0.2       # 初始开度20%
        flow_rate: 5.0     # 初始流量5m³/s
      parameters:
        diameter: 1.0      # 管径1米
        discharge_coefficient: 0.7  # 流量系数
        max_opening: 1.0   # 最大开度100%
        min_opening: 0.0   # 最小开度0%

  # 分水口2 - 工业用水
  - id: "Diversion_2"
    class: "core_lib.physical_objects.valve.Valve"
    config:
      initial_state:
        opening: 0.15      # 初始开度15%
        flow_rate: 3.0     # 初始流量3m³/s
      parameters:
        diameter: 0.8      # 管径0.8米
        discharge_coefficient: 0.65  # 流量系数
        max_opening: 1.0   # 最大开度100%
        min_opening: 0.0   # 最小开度0%
