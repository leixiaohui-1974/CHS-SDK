agents: {}
analysis:
  control_performance:
    enabled: true
  statistical_analysis:
    enabled: true
  system_identification:
    enabled: true
components:
  下游水库:
    area: 10000
    capacity: 8.0
    initial_level: 50
    max_level: 100
    min_level: 10
    type: Reservoir
  主水库:
    area: 10000
    capacity: 10.0
    initial_level: 50
    max_level: 100
    min_level: 10
    type: Reservoir
  仿真名称:
    area: 10000
    capacity: 1000000
    initial_level: 50
    max_level: 100
    min_level: 10
    type: Reservoir
  控制目标:
    area: 10000
    capacity: 1000000
    initial_level: 12.0
    max_level: 100
    min_level: 10
    type: Reservoir
  智能水泵:
    efficiency: 0.85
    initial_speed: 0
    max_flow: 30.0
    power: 1000
    type: Pump
  水位传感器1:
    area: 10000
    capacity: 1000000
    initial_level: 50
    max_level: 100
    min_level: 10
    type: Reservoir
  水位传感器2:
    area: 10000
    capacity: 1000000
    initial_level: 50
    max_level: 100
    min_level: 10
    type: Reservoir
  流量传感器:
    initial_opening: 0.5
    max_flow: 1000
    max_opening: 1
    min_opening: 0
    type: Gate
  约束条件:
    initial_opening: 0.5
    max_flow: 30.0
    max_opening: 1
    min_opening: 0
    type: Gate
  调节闸门:
    initial_opening: 0.5
    max_flow: 100.0
    max_opening: 1
    min_opening: 0
    type: Gate
debug:
  enabled: true
  log_file: simulation.log
  log_level: INFO
performance:
  enabled: true
  memory_monitoring: true
  time_tracking: true
simulation:
  description: 基于自然语言描述生成的仿真配置
  name: 智能水库调度系统
  solver:
    tolerance: 1.0e-06
    type: rk4
  time:
    end_time: 7200
    start_time: 0
    time_step: 0.5
  version: '1.5'
topology:
  connections:
  - from: 主水库
    to: 调节闸门
    type: flow
  - from: 调节闸门
    to: 下游水库
    type: flow
  - from: 智能水泵
    to: 主水库
    type: flow
visualization:
  enabled: true
  plots:
    enabled: true
    save_format: png
