apiVersion: v1
kind: Service
metadata:
  name: chs-simulation-api-service
  namespace: chs-simulation
  labels:
    app: chs-simulation-api
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: chs-simulation-api

---
apiVersion: v1
kind: Service
metadata:
  name: chs-simulation-frontend-service
  namespace: chs-simulation
  labels:
    app: chs-simulation-frontend
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: chs-simulation-frontend

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: chs-simulation
  labels:
    app: postgres
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: chs-simulation
  labels:
    app: redis
    component: cache
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis

---
# Headless service for StatefulSet (if needed for clustering)
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: chs-simulation
  labels:
    app: postgres
    component: database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: chs-simulation
  labels:
    app: redis
    component: cache
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis

---
# Load Balancer Service for External Access (Production)
apiVersion: v1
kind: Service
metadata:
  name: chs-simulation-lb
  namespace: chs-simulation
  labels:
    app: chs-simulation
    component: loadbalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: nginx-ingress-controller

---
# Staging Services
apiVersion: v1
kind: Service
metadata:
  name: chs-simulation-api-service-staging
  namespace: chs-simulation-staging
  labels:
    app: chs-simulation-api
    component: backend
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: chs-simulation-api
    environment: staging

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service-staging
  namespace: chs-simulation-staging
  labels:
    app: postgres
    component: database
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres
    environment: staging

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service-staging
  namespace: chs-simulation-staging
  labels:
    app: redis
    component: cache
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis
    environment: staging