# CHS-SDK 阿里云Kubernetes部署配置
apiVersion: v1
kind: Namespace
metadata:
  name: chs-sdk
  labels:
    name: chs-sdk
    environment: production

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: chs-config
  namespace: chs-sdk
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://your-domain.com,https://www.your-domain.com"
  WEBSOCKET_HEARTBEAT_INTERVAL: "30"
  MAX_WEBSOCKET_CONNECTIONS: "2000"
  WEBSOCKET_MONITOR_ENABLED: "true"
  MONITOR_INTERVAL: "5"
  MAX_HISTORY_SIZE: "2000"
  ALIYUN_REGION: "cn-hangzhou"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: chs-secrets
  namespace: chs-sdk
type: Opaque
data:
  SECRET_KEY: eW91ci1zZWNyZXQta2V5LWNoYW5nZS10aGlz  # base64 encoded
  POSTGRES_PASSWORD: eW91ci1zZWN1cmUtcG9zdGdyZXMtcGFzc3dvcmQ=  # base64 encoded
  REDIS_PASSWORD: eW91ci1zZWN1cmUtcmVkaXMtcGFzc3dvcmQ=  # base64 encoded
  ALIYUN_ACCESS_KEY_ID: eW91ci1hbGl5dW4tYWNjZXNzLWtleS1pZA==  # base64 encoded
  ALIYUN_ACCESS_KEY_SECRET: eW91ci1hbGl5dW4tYWNjZXNzLWtleS1zZWNyZXQ=  # base64 encoded

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chs-sdk
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "chs_simulation"
        - name: POSTGRES_USER
          value: "chs_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chs-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - chs_user
            - -d
            - chs_simulation
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - chs_user
            - -d
            - chs_simulation
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chs-sdk
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: chs-sdk
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --requirepass
        - $(REDIS_PASSWORD)
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chs-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - --raw
            - incr
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - --raw
            - incr
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chs-sdk
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

---
# CHS-SDK API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chs-api
  namespace: chs-sdk
  labels:
    app: chs-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chs-api
  template:
    metadata:
      labels:
        app: chs-api
    spec:
      containers:
      - name: chs-api
        image: registry.cn-hangzhou.aliyuncs.com/your-namespace/chs-sdk-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://chs_user:$(POSTGRES_PASSWORD)@postgres:5432/chs_simulation"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: chs-secrets
              key: SECRET_KEY
        - name: ALIYUN_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: chs-secrets
              key: ALIYUN_ACCESS_KEY_ID
        - name: ALIYUN_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: chs-secrets
              key: ALIYUN_ACCESS_KEY_SECRET
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chs-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chs-secrets
              key: REDIS_PASSWORD
        envFrom:
        - configMapRef:
            name: chs-config
        volumeMounts:
        - name: logs-storage
          mountPath: /app/logs
        - name: data-storage
          mountPath: /app/data
        - name: uploads-storage
          mountPath: /app/uploads
        - name: temp-storage
          mountPath: /app/temp
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/monitor/health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/monitor/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: logs-storage
        persistentVolumeClaim:
          claimName: logs-pvc
      - name: data-storage
        persistentVolumeClaim:
          claimName: data-pvc
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: uploads-pvc
      - name: temp-storage
        emptyDir: {}

---
# CHS-SDK API Service
apiVersion: v1
kind: Service
metadata:
  name: chs-api
  namespace: chs-sdk
  labels:
    app: chs-api
spec:
  selector:
    app: chs-api
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chs-ingress
  namespace: chs-sdk
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - your-domain.com
    - www.your-domain.com
    secretName: chs-tls-secret
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chs-api
            port:
              number: 8000
  - host: www.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chs-api
            port:
              number: 8000

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chs-api-hpa
  namespace: chs-sdk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chs-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80