# NGINX Ingress Controller Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chs-simulation-ingress
  namespace: chs-simulation
  labels:
    app: chs-simulation
    component: ingress
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # SSL/TLS Configuration
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-RSA-AES128-SHA,ECDHE-RSA-AES256-SHA,ECDHE-RSA-AES128-SHA256,ECDHE-RSA-AES256-SHA384"
    
    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self';" always;
    
    # Rate Limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://chs-simulation.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    
    # WebSocket Support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "chs-simulation-api-service"
    
    # File Upload Size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # Compression
    nginx.ingress.kubernetes.io/enable-gzip: "true"
    nginx.ingress.kubernetes.io/gzip-types: "text/plain,text/css,application/json,application/javascript,text/xml,application/xml,application/xml+rss,text/javascript"
spec:
  tls:
  - hosts:
    - chs-simulation.example.com
    - api.chs-simulation.example.com
    secretName: chs-simulation-tls
  rules:
  # Frontend
  - host: chs-simulation.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-frontend-service
            port:
              number: 80
  
  # API Backend
  - host: api.chs-simulation.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-api-service
            port:
              number: 8000
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-api-service
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-api-service
            port:
              number: 8000
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-api-service
            port:
              number: 9090

---
# Staging Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chs-simulation-ingress-staging
  namespace: chs-simulation-staging
  labels:
    app: chs-simulation
    component: ingress
    environment: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    
    # Basic Auth for Staging
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: staging-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - Staging Environment'
    
    # Security Headers (less strict for staging)
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Environment "staging" always;
    
    # Rate Limiting (more lenient for staging)
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # WebSocket Support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "chs-simulation-api-service-staging"
spec:
  tls:
  - hosts:
    - staging.chs-simulation.example.com
    - api.staging.chs-simulation.example.com
    secretName: chs-simulation-staging-tls
  rules:
  - host: staging.chs-simulation.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-frontend-service-staging
            port:
              number: 80
  - host: api.staging.chs-simulation.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-api-service-staging
            port:
              number: 8000
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-api-service-staging
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-api-service-staging
            port:
              number: 8000
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: chs-simulation-api-service-staging
            port:
              number: 9090

---
# Certificate Issuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Basic Auth Secret for Staging
apiVersion: v1
kind: Secret
metadata:
  name: staging-basic-auth
  namespace: chs-simulation-staging
type: Opaque
data:
  # Username: staging, Password: staging123
  # Generated with: htpasswd -nb staging staging123 | base64
  auth: c3RhZ2luZzokYXByMSRILjRkNzFQZiRtSVNqWGNRWUJhVGJXLjNxVGJHNy4wCg==

---
# Network Policy for Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-network-policy
  namespace: chs-simulation
spec:
  podSelector:
    matchLabels:
      app: chs-simulation-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9090
  - from:
    - podSelector:
        matchLabels:
          app: chs-simulation-frontend
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80