  - from: 水库A
    to: 泵站1
    type: flow
  - from: 水库B
    to: 泵站2
    type: flow
  - from: 汇流点1
    to: 泵站3
    type: flow
  - from: 渠道
    to: 汇流点2
    type: flow
visualization:
  enabled: true
  plots:
    enabled: true
    save_format: png
