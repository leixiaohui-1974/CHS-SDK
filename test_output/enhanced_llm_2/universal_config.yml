simulation:
  duration: 7200
  dt: 0.5
  name: complex_water_scheduling_system
  solver: rk4
components:
- id: reservoir_A
  type: Reservoir
  params:
    capacity: 5000
- id: reservoir_B
  type: Reservoir
  params:
    capacity: 3000
- id: pump_station_1
  type: PumpStation
  params:
    power: 100
- id: pump_station_2
  type: PumpStation
  params:
    power: 150
- id: pump_station_3
  type: PumpStation
  params:
    power: 200
- id: canal_1
  type: Canal
  params:
    length: 10000
- id: junction_1
  type: Junction
- id: junction_2
  type: Junction
topology:
- from: reservoir_A
  to: pump_station_1
  type: flow
- from: pump_station_1
  to: junction_1
  type: flow
- from: reservoir_B
  to: pump_station_2
  type: flow
- from: pump_station_2
  to: junction_1
  type: flow
- from: junction_1
  to: pump_station_3
  type: flow
- from: pump_station_3
  to: canal_1
  type: flow
- from: canal_1
  to: junction_2
  type: flow
