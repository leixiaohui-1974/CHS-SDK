agents: {}
components:
  channel1:
    type: Channel
  junction1:
    type: Junction
  pump1:
    efficiency: 0.85
    initial_speed: 0
    max_flow: 500
    power: 1000
    type: Pump
  reservoir1:
    area: 10000
    capacity: 1000000
    initial_level: 50
    max_level: 100
    min_level: 10
    type: Reservoir
debug:
  enabled: true
  log_file: simulation.log
  log_level: INFO
performance:
  enabled: true
  memory_monitoring: true
  time_tracking: true
simulation:
  description: 基于自然语言描述生成的仿真配置
  name: 自动生成的仿真
  solver:
    tolerance: 1.0e-06
    type: rk4
  time:
    end_time: 3600
    start_time: 0
    time_step: 1.0
  version: '1.5'
topology:
  connections:
  - from: reservoir1
    to: pump1
    type: flow
  - from: channel1
    to: junction1
    type: flow
visualization:
  enabled: true
  plots:
    enabled: true
    save_format: png
