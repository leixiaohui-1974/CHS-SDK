agents:
  central_dispatcher:
    target: component_1
    type: Agent
  csv_inflow_agent:
    target: component_1
    type: Agent
  digital_twins:
    target: component_1
    type: Agent
  emergency_agent:
    target: component_1
    type: Agent
analysis:
  control_performance:
    enabled: true
components:
  connection_pool:
    area: 10000
    capacity: 1000000
    initial_level: 50
    max_level: 100
    min_level: 10
    type: Reservoir
  inlet_gate:
    initial_opening: 0.5
    max_flow: 1000
    max_opening: 1
    min_opening: 0
    type: Gate
  outlet_valve:
    type: Valve
  pipe1_valve:
    type: Valve
  pipe_1:
    type: Pipe
  pipe_2:
    type: Pipe
  terminal_pool:
    area: 10000
    capacity: 1000000
    initial_level: 50
    max_level: 100
    min_level: 10
    type: Reservoir
  tunnel1_gate:
    initial_opening: 0.5
    max_flow: 1000
    max_opening: 1
    min_opening: 0
    type: Gate
  tunnel_1:
    type: Canal
  tunnel_2:
    type: Canal
  tunnel_3:
    type: Canal
  wendegen_reservoir:
    area: 10000
    capacity: 1000000
    initial_level: 50
    max_level: 100
    min_level: 10
    type: Reservoir
debug:
  enabled: true
  log_file: simulation.log
  log_level: INFO
performance:
  enabled: true
  memory_monitoring: true
  time_tracking: true
simulation:
  description: 基于自然语言描述生成的仿真配置
  name: 自动生成的仿真
  solver:
    tolerance: 1.0e-06
    type: rk4
  time:
    end_time: 3600
    start_time: 0
    time_step: 1.0
  version: '1.5'
topology:
  connections:
  - from: 包含11个
    to: 关系
    type: flow
  - from: 具体
    to: 关系
    type: flow
  - from: wendegen_reservoir
    to: inlet_gate
    type: flow
  - from: inlet_gate
    to: tunnel_1
    type: flow
  - from: tunnel_1
    to: tunnel1_gate
    type: flow
  - from: tunnel1_gate
    to: connection_pool
    type: flow
  - from: connection_pool
    to: tunnel_2
    type: flow
  - from: tunnel_2
    to: pipe_1
    type: flow
  - from: pipe_1
    to: pipe1_valve
    type: flow
  - from: pipe1_valve
    to: tunnel_3
    type: flow
  - from: tunnel_3
    to: pipe_2
    type: flow
  - from: pipe_2
    to: outlet_valve
    type: flow
  - from: outlet_valve
    to: terminal_pool
    type: flow
visualization:
  enabled: true
  plots:
    enabled: true
    save_format: png
