# CHS-SDK 场景配置管理文件
# 该文件定义了场景管理系统的全局配置

version: "1.0"
last_updated: "2024-01-23T12:30:00"

# 场景管理配置
scenario_management:
  template_directory: "scenarios/templates"
  instance_directory: "scenarios/instances"
  backup_directory: "scenarios/backups"
  
  # 自动备份配置
  auto_backup:
    enabled: true
    interval: 24  # 小时
    max_backups: 30
  
  # 版本控制
  version_control:
    enabled: true
    track_changes: true
    max_versions: 10

# 场景分类定义
scenario_categories:
  flood_control:
    name: "洪水控制"
    description: "洪水防控和应急响应场景"
    color: "#FF6B6B"
    icon: "flood"
    priority: "high"
  
  drought_management:
    name: "干旱管理"
    description: "干旱条件下的水资源优化配置"
    color: "#FFE66D"
    icon: "drought"
    priority: "high"
  
  normal_operation:
    name: "正常运行"
    description: "标准工况下的系统运行"
    color: "#4ECDC4"
    icon: "normal"
    priority: "medium"
  
  maintenance:
    name: "维护模式"
    description: "系统维护和检修场景"
    color: "#45B7D1"
    icon: "maintenance"
    priority: "medium"
  
  emergency:
    name: "紧急响应"
    description: "紧急情况和故障处理"
    color: "#FF4757"
    icon: "emergency"
    priority: "critical"
  
  testing:
    name: "测试验证"
    description: "系统测试和验证场景"
    color: "#A55EEA"
    icon: "test"
    priority: "low"

# 已注册的场景模板
registered_templates:
  flood_control_scenario:
    file: "flood_control_scenario.yml"
    category: "flood_control"
    status: "active"
    version: "1.0"
    created_at: "2024-01-23T10:00:00"
    last_modified: "2024-01-23T10:00:00"
    author: "CHS-SDK Team"
    description: "标准洪水控制场景模板"
    tags: ["flood", "emergency", "control"]
    complexity: "medium"
    estimated_duration: 480  # 分钟
  
  drought_management_scenario:
    file: "drought_management_scenario.yml"
    category: "drought_management"
    status: "active"
    version: "1.0"
    created_at: "2024-01-23T10:30:00"
    last_modified: "2024-01-23T10:30:00"
    author: "CHS-SDK Team"
    description: "干旱管理和水资源优化模板"
    tags: ["drought", "conservation", "optimization"]
    complexity: "high"
    estimated_duration: 10080  # 分钟 (7天)
  
  normal_operation_scenario:
    file: "normal_operation_scenario.yml"
    category: "normal_operation"
    status: "active"
    version: "1.0"
    created_at: "2024-01-23T11:00:00"
    last_modified: "2024-01-23T11:00:00"
    author: "CHS-SDK Team"
    description: "正常运行条件下的系统操作模板"
    tags: ["normal", "operation", "efficiency"]
    complexity: "low"
    estimated_duration: 10080  # 分钟 (7天)

# 场景实例注册表
registered_instances:
  flood_control_instance_001:
    file: "flood_control_instance_001.yml"
    template: "flood_control_scenario"
    status: "inactive"
    created_at: "2024-01-23T12:00:00"
    last_modified: "2024-01-23T12:00:00"
    author: "Test Engineer"
    description: "中等强度洪水控制测试场景"
    tags: ["test", "medium_intensity", "validation"]
    priority: "medium"
    execution_count: 0
    last_execution: null

# 场景执行历史
execution_history:
  enabled: true
  max_records: 1000
  retention_period: 90  # 天
  
  # 记录字段
  record_fields:
    - "scenario_id"
    - "template_name"
    - "start_time"
    - "end_time"
    - "duration"
    - "status"
    - "performance_metrics"
    - "errors"
    - "warnings"

# 性能监控配置
performance_monitoring:
  enabled: true
  
  # 关键性能指标
  key_metrics:
    - name: "execution_time"
      description: "场景执行时间"
      unit: "seconds"
      threshold: 3600  # 1小时
    
    - name: "memory_usage"
      description: "内存使用量"
      unit: "MB"
      threshold: 2048
    
    - name: "cpu_usage"
      description: "CPU使用率"
      unit: "percent"
      threshold: 80
    
    - name: "success_rate"
      description: "成功执行率"
      unit: "percent"
      threshold: 95
  
  # 告警配置
  alerts:
    - condition: "execution_time > threshold"
      action: "log_warning"
      message: "场景执行时间超过阈值"
    
    - condition: "memory_usage > threshold"
      action: "log_error"
      message: "内存使用量过高"
    
    - condition: "success_rate < threshold"
      action: "send_notification"
      message: "场景成功率低于预期"

# 验证规则配置
validation_rules:
  global_rules:
    - rule: "required_parameters_present"
      description: "检查必需参数是否存在"
      severity: "error"
    
    - rule: "parameter_type_validation"
      description: "验证参数类型"
      severity: "error"
    
    - rule: "parameter_range_validation"
      description: "验证参数范围"
      severity: "warning"
    
    - rule: "dependency_check"
      description: "检查依赖关系"
      severity: "error"
  
  custom_validators:
    - name: "water_level_validator"
      description: "水位参数验证器"
      rules:
        - "min_level < max_level"
        - "initial_level >= min_level"
        - "initial_level <= max_level"
    
    - name: "flow_rate_validator"
      description: "流量参数验证器"
      rules:
        - "flow_rate > 0"
        - "flow_rate <= system_capacity"

# 场景推荐系统
recommendation_system:
  enabled: true
  
  # 推荐算法配置
  algorithms:
    - name: "similarity_based"
      weight: 0.4
      description: "基于相似性的推荐"
    
    - name: "performance_based"
      weight: 0.3
      description: "基于性能的推荐"
    
    - name: "usage_frequency"
      weight: 0.3
      description: "基于使用频率的推荐"
  
  # 推荐触发条件
  triggers:
    - condition: "new_user_login"
      action: "recommend_popular_scenarios"
    
    - condition: "scenario_execution_completed"
      action: "recommend_similar_scenarios"
    
    - condition: "performance_threshold_exceeded"
      action: "recommend_optimization_scenarios"

# 集成配置
integration:
  # IDE集成
  ide_integration:
    enabled: true
    supported_ides: ["vscode", "trae_ai"]
    plugin_version: "1.0.0"
  
  # API配置
  api_integration:
    enabled: true
    base_url: "/api/v1/scenarios"
    authentication: "required"
    rate_limiting:
      requests_per_minute: 100
      burst_limit: 20
  
  # 外部工具集成
  external_tools:
    - name: "grafana"
      type: "monitoring"
      endpoint: "http://localhost:3000"
      enabled: true
    
    - name: "jupyter"
      type: "analysis"
      endpoint: "http://localhost:8888"
      enabled: false

# 安全配置
security:
  access_control:
    enabled: true
    default_permissions: "read"
    
    roles:
      - name: "admin"
        permissions: ["read", "write", "execute", "delete"]
      
      - name: "engineer"
        permissions: ["read", "write", "execute"]
      
      - name: "viewer"
        permissions: ["read"]
  
  audit_logging:
    enabled: true
    log_level: "info"
    retention_period: 365  # 天

# 通知配置
notifications:
  enabled: true
  
  channels:
    - name: "email"
      enabled: true
      recipients: ["admin@example.com"]
    
    - name: "slack"
      enabled: false
      webhook_url: "https://hooks.slack.com/..."
    
    - name: "log"
      enabled: true
      log_level: "info"
  
  events:
    - event: "scenario_execution_started"
      channels: ["log"]
    
    - event: "scenario_execution_completed"
      channels: ["log"]
    
    - event: "scenario_execution_failed"
      channels: ["email", "log"]
    
    - event: "performance_threshold_exceeded"
      channels: ["email", "log"]

# 数据导出配置
data_export:
  enabled: true
  
  formats:
    - "json"
    - "yaml"
    - "csv"
    - "excel"
  
  export_options:
    include_metadata: true
    include_performance_data: true
    include_execution_history: false
    compress_output: true

# 系统配置
system:
  max_concurrent_scenarios: 5
  scenario_timeout: 7200  # 秒 (2小时)
  cleanup_interval: 3600   # 秒 (1小时)
  
  # 资源限制
  resource_limits:
    max_memory_per_scenario: 4096  # MB
    max_cpu_per_scenario: 80       # percent
    max_disk_space: 10240          # MB
  
  # 缓存配置
  cache:
    enabled: true
    ttl: 3600  # 秒
    max_size: 1000  # 条目数