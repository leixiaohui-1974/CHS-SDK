version: '3.8'

services:
  # 备份调度器
  backup-scheduler:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile.scheduler
    container_name: chs-backup-scheduler
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Shanghai
      - BACKUP_NOTIFICATION_WEBHOOK=${BACKUP_NOTIFICATION_WEBHOOK:-}
      - S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-chs_platform}
      - POSTGRES_USER=${POSTGRES_USER:-chs_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ./scripts/backup:/app/scripts/backup
      - ./config/backup:/app/config/backup
      - backup_data:/app/backups
      - backup_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data:ro
    ports:
      - "8080:8080"  # 健康检查端口
    networks:
      - chs-network
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: [
      "python", "/app/scripts/backup/backup_scheduler.py",
      "--config", "/app/config/backup/scheduler_config.json",
      "--start"
    ]

  # 数据库备份服务
  database-backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile.database
    container_name: chs-database-backup
    restart: "no"  # 按需启动
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Shanghai
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-chs_platform}
      - POSTGRES_USER=${POSTGRES_USER:-chs_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - BACKUP_NOTIFICATION_WEBHOOK=${BACKUP_NOTIFICATION_WEBHOOK:-}
    volumes:
      - ./scripts/backup:/app/scripts/backup
      - ./config/backup:/app/config/backup
      - backup_data:/app/backups
      - backup_logs:/app/logs
    networks:
      - chs-network
    depends_on:
      - postgres
    profiles:
      - backup

  # 文件备份服务
  file-backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile.files
    container_name: chs-file-backup
    restart: "no"  # 按需启动
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Shanghai
      - S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - BACKUP_NOTIFICATION_WEBHOOK=${BACKUP_NOTIFICATION_WEBHOOK:-}
    volumes:
      - ./scripts/backup:/app/scripts/backup
      - ./config/backup:/app/config/backup
      - backup_data:/app/backups
      - backup_logs:/app/logs
      - ./data:/app/data
      - ./uploads:/app/uploads
    ports:
      - "8081:8081"  # 监控端口
    networks:
      - chs-network
    profiles:
      - backup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  # 灾难恢复服务
  disaster-recovery:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile.recovery
    container_name: chs-disaster-recovery
    restart: "no"  # 按需启动
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Shanghai
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-chs_platform}
      - POSTGRES_USER=${POSTGRES_USER:-chs_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - KUBECONFIG=/app/config/kubeconfig
    volumes:
      - ./scripts/backup:/app/scripts/backup
      - ./config:/app/config
      - backup_data:/app/backups
      - backup_logs:/app/logs
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/app/.kube:ro
    networks:
      - chs-network
    depends_on:
      - postgres
      - redis
    profiles:
      - recovery
    privileged: true  # 需要访问Docker socket

  # 备份监控服务
  backup-monitor:
    image: prom/prometheus:latest
    container_name: chs-backup-monitor
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/backup.yml:/etc/prometheus/prometheus.yml
      - backup_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - chs-network
    profiles:
      - monitoring

  # 备份日志收集
  backup-logs:
    image: fluent/fluent-bit:latest
    container_name: chs-backup-logs
    restart: unless-stopped
    volumes:
      - ./logging/fluent-bit/backup.conf:/fluent-bit/etc/fluent-bit.conf
      - backup_logs:/var/log/backup:ro
    networks:
      - chs-network
    depends_on:
      - elasticsearch
    profiles:
      - logging

volumes:
  backup_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./backups
  backup_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/backup
  backup_prometheus_data:
    driver: local

networks:
  chs-network:
    external: true