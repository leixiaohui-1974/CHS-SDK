# Prometheus 告警规则
# CHS 仿真平台告警配置

groups:
  # 系统级别告警
  - name: system.rules
    rules:
      # 高 CPU 使用率告警
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "高 CPU 使用率告警"
          description: "实例 {{ $labels.instance }} CPU 使用率超过 80%，当前值: {{ $value }}%"

      # 高内存使用率告警
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "高内存使用率告警"
          description: "实例 {{ $labels.instance }} 内存使用率超过 85%，当前值: {{ $value }}%"

      # 磁盘空间不足告警
      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "磁盘空间不足告警"
          description: "实例 {{ $labels.instance }} 磁盘 {{ $labels.mountpoint }} 使用率超过 90%，当前值: {{ $value }}%"

      # 节点宕机告警
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "节点宕机告警"
          description: "节点 {{ $labels.instance }} 已宕机超过 1 分钟"

  # 应用级别告警
  - name: application.rules
    rules:
      # API 服务宕机告警
      - alert: APIServiceDown
        expr: up{job="chs-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API 服务宕机告警"
          description: "CHS API 服务 {{ $labels.instance }} 已宕机超过 1 分钟"

      # API 响应时间过长告警
      - alert: HighAPIResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="chs-api"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API 响应时间过长告警"
          description: "API 95% 响应时间超过 2 秒，当前值: {{ $value }}s"

      # API 错误率过高告警
      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{job="chs-api",status=~"5.."}[5m]) / rate(http_requests_total{job="chs-api"}[5m]) * 100 > 5
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API 错误率过高告警"
          description: "API 5xx 错误率超过 5%，当前值: {{ $value }}%"

      # 仿真引擎服务宕机告警
      - alert: SimulationEngineDown
        expr: up{job="chs-simulation-engine"} == 0
        for: 1m
        labels:
          severity: critical
          service: simulation
        annotations:
          summary: "仿真引擎服务宕机告警"
          description: "仿真引擎服务 {{ $labels.instance }} 已宕机超过 1 分钟"

      # 仿真任务队列积压告警
      - alert: SimulationQueueBacklog
        expr: simulation_queue_size > 100
        for: 10m
        labels:
          severity: warning
          service: simulation
        annotations:
          summary: "仿真任务队列积压告警"
          description: "仿真任务队列积压超过 100 个任务，当前值: {{ $value }}"

  # 数据库告警
  - name: database.rules
    rules:
      # PostgreSQL 服务宕机告警
      - alert: PostgreSQLDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "PostgreSQL 服务宕机告警"
          description: "PostgreSQL 服务 {{ $labels.instance }} 已宕机超过 1 分钟"

      # 数据库连接数过高告警
      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "数据库连接数过高告警"
          description: "数据库连接数超过 80%，当前值: {{ $value }}%"

      # 数据库查询时间过长告警
      - alert: SlowDatabaseQueries
        expr: pg_stat_activity_max_tx_duration > 300
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "数据库查询时间过长告警"
          description: "数据库存在运行超过 5 分钟的查询，最长时间: {{ $value }}s"

      # Redis 服务宕机告警
      - alert: RedisDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: cache
        annotations:
          summary: "Redis 服务宕机告警"
          description: "Redis 服务 {{ $labels.instance }} 已宕机超过 1 分钟"

      # Redis 内存使用率过高告警
      - alert: HighRedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: cache
        annotations:
          summary: "Redis 内存使用率过高告警"
          description: "Redis 内存使用率超过 90%，当前值: {{ $value }}%"

  # Kubernetes 告警
  - name: kubernetes.rules
    rules:
      # Pod 重启频繁告警
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "Pod 重启频繁告警"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 在过去 15 分钟内重启了 {{ $value }} 次"

      # Pod 状态异常告警
      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="false"} == 1
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "Pod 状态异常告警"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 未就绪超过 5 分钟"

      # 节点资源不足告警
      - alert: NodeResourcePressure
        expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1 or kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "节点资源不足告警"
          description: "节点 {{ $labels.node }} 存在资源压力: {{ $labels.condition }}"

      # PVC 存储空间不足告警
      - alert: PVCStorageLow
        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100 < 10
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "PVC 存储空间不足告警"
          description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 可用空间不足 10%，当前值: {{ $value }}%"

  # 业务指标告警
  - name: business.rules
    rules:
      # 用户注册异常告警
      - alert: HighUserRegistrationFailure
        expr: rate(user_registration_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "用户注册异常告警"
          description: "用户注册失败率过高，当前值: {{ $value }}/s"

      # 仿真失败率过高告警
      - alert: HighSimulationFailureRate
        expr: rate(simulation_failures_total[5m]) / rate(simulation_total[5m]) * 100 > 10
        for: 10m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "仿真失败率过高告警"
          description: "仿真失败率超过 10%，当前值: {{ $value }}%"

      # 文件上传失败率过高告警
      - alert: HighFileUploadFailureRate
        expr: rate(file_upload_failures_total[5m]) / rate(file_upload_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "文件上传失败率过高告警"
          description: "文件上传失败率超过 5%，当前值: {{ $value }}%"