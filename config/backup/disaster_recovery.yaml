# CHS 仿真平台灾难恢复配置

# 数据库配置
db_host: "localhost"
db_port: 5432
db_name: "chs_simulation"
db_user: "chs_user"
db_password: "${DB_PASSWORD}"

# Redis 配置
redis_host: "localhost"
redis_port: 6379
redis_password: "${REDIS_PASSWORD}"

# 备份路径
backup_base_dir: "/app/backups"

# Kubernetes 配置
k8s_config_path: "/root/.kube/config"
k8s_namespace: "chs-platform"

# 服务配置
services:
  api_server:
    health_check_url: "http://localhost:8000/health"
    restart_command: "systemctl restart chs-api"
    config_files:
      - "/app/config/api_config.yaml"
  
  simulation_engine:
    health_check_url: "http://localhost:8001/health"
    restart_command: "systemctl restart chs-simulation"
    config_files:
      - "/app/config/simulation_config.yaml"
  
  web_frontend:
    health_check_url: "http://localhost:3000/health"
    restart_command: "systemctl restart chs-frontend"
    config_files:
      - "/app/config/frontend_config.json"
  
  nginx:
    health_check_url: "http://localhost/health"
    restart_command: "systemctl restart nginx"
    config_files:
      - "/etc/nginx/nginx.conf"
      - "/etc/nginx/sites-available/chs-platform"
  
  postgresql:
    health_check_url: null
    restart_command: "systemctl restart postgresql"
    config_files:
      - "/etc/postgresql/14/main/postgresql.conf"
      - "/etc/postgresql/14/main/pg_hba.conf"
  
  redis:
    health_check_url: null
    restart_command: "systemctl restart redis"
    config_files:
      - "/etc/redis/redis.conf"

# 恢复选项
recovery_mode: "full"  # full, partial, data_only
verify_after_recovery: true
notification_webhook: "${RECOVERY_NOTIFICATION_WEBHOOK}"

# 恢复步骤配置
recovery_steps:
  - name: "stop_services"
    description: "停止所有服务"
    timeout: 300
    critical: true
  
  - name: "backup_current_data"
    description: "备份当前数据（安全措施）"
    timeout: 1800
    critical: false
  
  - name: "restore_database"
    description: "恢复数据库"
    timeout: 3600
    critical: true
  
  - name: "restore_files"
    description: "恢复文件"
    timeout: 1800
    critical: true
  
  - name: "restore_configurations"
    description: "恢复配置文件"
    timeout: 300
    critical: true
  
  - name: "start_services"
    description: "启动所有服务"
    timeout: 600
    critical: true
  
  - name: "verify_recovery"
    description: "验证恢复结果"
    timeout: 300
    critical: false

# 验证配置
verification:
  database:
    - query: "SELECT COUNT(*) FROM users"
      expected_min: 1
    - query: "SELECT COUNT(*) FROM simulations"
      expected_min: 0
    - query: "SELECT version FROM schema_migrations ORDER BY version DESC LIMIT 1"
      expected_pattern: "^\\d{14}$"
  
  files:
    - path: "/app/uploads"
      check_exists: true
    - path: "/app/simulation_results"
      check_exists: true
    - path: "/app/config"
      check_exists: true
  
  services:
    - name: "postgresql"
      command: "pg_isready -h localhost -p 5432"
    - name: "redis"
      command: "redis-cli ping"
    - name: "nginx"
      command: "nginx -t"

# 回滚配置
rollback:
  enabled: true
  auto_rollback_on_failure: true
  rollback_timeout: 1800
  preserve_logs: true

# 通知配置
notifications:
  email:
    enabled: true
    smtp_server: "${SMTP_SERVER}"
    smtp_port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    from_address: "noreply@chs-platform.com"
    to_addresses:
      - "admin@chs-platform.com"
      - "ops@chs-platform.com"
  
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channel: "#alerts"
  
  webhook:
    enabled: true
    url: "${RECOVERY_NOTIFICATION_WEBHOOK}"
    timeout: 10
    retry_count: 3

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "/app/logs/disaster_recovery.log"
  max_size: "100MB"
  backup_count: 5
  console_output: true

# 安全配置
security:
  require_confirmation: true
  confirmation_timeout: 300
  audit_log: true
  encrypt_sensitive_data: true
  access_control:
    allowed_users:
      - "admin"
      - "ops"
    required_permissions:
      - "disaster_recovery"
      - "system_admin"

# 性能配置
performance:
  parallel_operations: 4
  chunk_size: 1048576  # 1MB
  compression_level: 6
  network_timeout: 300
  retry_attempts: 3
  retry_delay: 5

# 监控配置
monitoring:
  progress_reporting: true
  progress_interval: 30  # seconds
  health_checks: true
  health_check_interval: 60  # seconds
  metrics_collection: true
  metrics_endpoint: "http://localhost:9090/metrics"