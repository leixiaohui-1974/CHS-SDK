name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨2点运行
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  POSTGRES_VERSION: '15'
  REDIS_VERSION: '7'

jobs:
  # 代码质量检查
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy bandit safety
        pip install -r api/requirements.txt
    
    - name: Run Black
      run: black --check api/ tests/
    
    - name: Run isort
      run: isort --check-only api/ tests/
    
    - name: Run flake8
      run: flake8 api/ tests/
    
    - name: Run mypy
      run: mypy api/
    
    - name: Run Bandit
      run: bandit -r api/
    
    - name: Run Safety
      run: safety check

  # 单元测试
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install -r requirements-test.txt
    
    - name: Run unit tests
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
        SECRET_KEY: test-secret-key
        JWT_SECRET_KEY: test-jwt-secret
        TESTING: true
      run: |
        pytest tests/unit/ -v --cov=api --cov-report=xml --cov-report=html --junitxml=test-results/unit-tests.xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unit-tests
        name: codecov-umbrella
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results-${{ matrix.python-version }}
        path: |
          test-results/
          htmlcov/

  # 前端测试
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Run linting
      working-directory: frontend
      run: npm run lint
    
    - name: Run type checking
      working-directory: frontend
      run: npm run type-check
    
    - name: Run unit tests
      working-directory: frontend
      run: npm test -- --coverage --watchAll=false
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend-tests
        name: codecov-umbrella
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: frontend-test-results
        path: |
          frontend/coverage/
          frontend/test-results/

  # 集成测试
  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install -r requirements-test.txt
    
    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      working-directory: api
      run: alembic upgrade head
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
        SECRET_KEY: test-secret-key
        JWT_SECRET_KEY: test-jwt-secret
        TESTING: true
      run: |
        pytest tests/integration/ -v --junitxml=test-results/integration-tests.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: test-results/

  # 端到端测试
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install -r requirements-test.txt
    
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Build frontend
      working-directory: frontend
      run: npm run build
    
    - name: Start services with Docker Compose
      run: |
        docker-compose -f docker-compose.test.yml up -d test-db test-redis
        sleep 10
    
    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://test:test@localhost:5433/test_db
      working-directory: api
      run: alembic upgrade head
    
    - name: Start API server
      env:
        DATABASE_URL: postgresql://test:test@localhost:5433/test_db
        REDIS_URL: redis://localhost:6380
        SECRET_KEY: test-secret-key
        JWT_SECRET_KEY: test-jwt-secret
      working-directory: api
      run: |
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Start frontend server
      env:
        REACT_APP_API_URL: http://localhost:8000
        REACT_APP_WS_URL: ws://localhost:8000
      working-directory: frontend
      run: |
        npm start &
        sleep 15
    
    - name: Install Playwright
      run: |
        pip install playwright
        playwright install chromium
    
    - name: Run E2E tests
      env:
        API_BASE_URL: http://localhost:8000
        FRONTEND_BASE_URL: http://localhost:3000
      run: |
        pytest tests/e2e/ -v --junitxml=test-results/e2e-tests.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          test-results/
          screenshots/
    
    - name: Stop services
      if: always()
      run: docker-compose -f docker-compose.test.yml down

  # 性能测试
  performance-tests:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf-test]')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install -r requirements-test.txt
    
    - name: Start services
      run: |
        docker-compose -f docker-compose.test.yml up -d test-db test-redis test-api
        sleep 30
    
    - name: Run performance tests
      run: |
        pytest tests/performance/ -v --junitxml=test-results/performance-tests.xml
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: |
          test-results/
          performance-reports/
    
    - name: Stop services
      if: always()
      run: docker-compose -f docker-compose.test.yml down

  # 安全测试
  security-tests:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install -r requirements-test.txt
    
    - name: Start services
      run: |
        docker-compose -f docker-compose.test.yml up -d test-db test-redis test-api
        sleep 30
    
    - name: Run security tests
      run: |
        pytest tests/security/ -v --junitxml=test-results/security-tests.xml
    
    - name: Upload security results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-test-results
        path: |
          test-results/
          security-reports/
    
    - name: Stop services
      if: always()
      run: docker-compose -f docker-compose.test.yml down

  # Docker构建测试
  docker-build:
    runs-on: ubuntu-latest
    needs: [code-quality]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build API Docker image
      run: |
        docker build -t chs-simulation-api:test ./api
    
    - name: Build Frontend Docker image
      run: |
        docker build -t chs-simulation-frontend:test ./frontend
    
    - name: Build Test Docker image
      run: |
        docker build -t chs-simulation-test:test -f Dockerfile.test .
    
    - name: Test Docker images
      run: |
        docker run --rm chs-simulation-api:test python -c "import main; print('API image OK')"
        docker run --rm chs-simulation-test:test python -c "import pytest; print('Test image OK')"

  # 测试报告汇总
  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests, integration-tests, e2e-tests, security-tests]
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all test results
      uses: actions/download-artifact@v3
      with:
        path: all-test-results/
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install junitparser junit2html
    
    - name: Generate test summary
      run: |
        python scripts/generate_test_summary.py all-test-results/ test-summary.html
    
    - name: Upload test summary
      uses: actions/upload-artifact@v3
      with:
        name: test-summary
        path: test-summary.html
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-summary.html', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 测试结果摘要\n\n测试报告已生成，请查看 [测试摘要](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 了解详细信息。`
          });

  # 部署到测试环境
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # 这里添加部署到测试环境的逻辑
        ./scripts/deploy.sh staging
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # 这里添加冒烟测试逻辑
        pytest tests/smoke/ --base-url=https://staging.chs-simulation.com

  # 部署到生产环境
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # 这里添加部署到生产环境的逻辑
        ./scripts/deploy.sh production
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on production..."
        # 这里添加冒烟测试逻辑
        pytest tests/smoke/ --base-url=https://chs-simulation.com