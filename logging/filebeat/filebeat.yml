# Filebeat 配置文件
# CHS 仿真平台日志收集配置

# ============================== Filebeat inputs ===============================
filebeat.inputs:

# API 服务日志
- type: log
  enabled: true
  paths:
    - /var/log/chs/api/*.log
    - /var/log/chs/api/*/*.log
  fields:
    service: chs-api
    environment: production
    log_type: application
  fields_under_root: false
  multiline.pattern: '^\d{4}-\d{2}-\d{2}'
  multiline.negate: true
  multiline.match: after
  exclude_lines: ['^DEBUG']
  include_lines: ['^(INFO|WARN|ERROR|FATAL)']
  json.keys_under_root: true
  json.add_error_key: true
  processors:
    - add_host_metadata:
        when.not.contains.tags: forwarded
    - add_docker_metadata: ~
    - add_kubernetes_metadata: ~

# 仿真引擎日志
- type: log
  enabled: true
  paths:
    - /var/log/chs/simulation/*.log
    - /var/log/chs/simulation/*/*.log
  fields:
    service: simulation-engine
    environment: production
    log_type: application
  fields_under_root: false
  multiline.pattern: '^\[\d{4}-\d{2}-\d{2}'
  multiline.negate: true
  multiline.match: after
  processors:
    - add_host_metadata: ~
    - add_docker_metadata: ~
    - add_kubernetes_metadata: ~

# Nginx 访问日志
- type: log
  enabled: true
  paths:
    - /var/log/nginx/access.log
    - /var/log/nginx/chs-access.log
  fields:
    service: nginx
    environment: production
    log_type: access
  fields_under_root: false
  processors:
    - add_host_metadata: ~

# Nginx 错误日志
- type: log
  enabled: true
  paths:
    - /var/log/nginx/error.log
    - /var/log/nginx/chs-error.log
  fields:
    service: nginx
    environment: production
    log_type: error
  fields_under_root: false
  multiline.pattern: '^\d{4}/\d{2}/\d{2}'
  multiline.negate: true
  multiline.match: after
  processors:
    - add_host_metadata: ~

# PostgreSQL 日志
- type: log
  enabled: true
  paths:
    - /var/log/postgresql/*.log
    - /var/lib/postgresql/data/log/*.log
  fields:
    service: postgresql
    environment: production
    log_type: database
  fields_under_root: false
  multiline.pattern: '^\d{4}-\d{2}-\d{2}'
  multiline.negate: true
  multiline.match: after
  processors:
    - add_host_metadata: ~

# Redis 日志
- type: log
  enabled: true
  paths:
    - /var/log/redis/*.log
    - /data/redis.log
  fields:
    service: redis
    environment: production
    log_type: cache
  fields_under_root: false
  processors:
    - add_host_metadata: ~

# 系统日志
- type: log
  enabled: true
  paths:
    - /var/log/syslog
    - /var/log/messages
  fields:
    service: system
    environment: production
    log_type: system
  fields_under_root: false
  processors:
    - add_host_metadata: ~

# Docker 容器日志
- type: container
  enabled: true
  paths:
    - '/var/lib/docker/containers/*/*.log'
  processors:
    - add_docker_metadata:
        host: "unix:///var/run/docker.sock"
    - decode_json_fields:
        fields: ["message"]
        target: ""
        overwrite_keys: true

# Kubernetes Pod 日志
- type: kubernetes
  enabled: true
  hints.enabled: true
  hints.default_config:
    type: container
    paths:
      - /var/log/containers/*${data.kubernetes.container.id}.log
  processors:
    - add_kubernetes_metadata:
        host: ${NODE_NAME}
        matchers:
        - logs_path:
            logs_path: "/var/log/containers/"

# 审计日志
- type: log
  enabled: true
  paths:
    - /var/log/chs/audit/*.log
  fields:
    service: audit
    environment: production
    log_type: security
  fields_under_root: false
  json.keys_under_root: true
  json.add_error_key: true
  processors:
    - add_host_metadata: ~

# 性能监控日志
- type: log
  enabled: true
  paths:
    - /var/log/chs/performance/*.log
  fields:
    service: performance
    environment: production
    log_type: metrics
  fields_under_root: false
  json.keys_under_root: true
  processors:
    - add_host_metadata: ~

# ============================== Filebeat modules ===============================
filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: true
  reload.period: 10s

# ================================== General ===================================
name: "chs-filebeat"
tags: ["chs", "simulation", "platform"]

# ================================== Outputs ===================================

# Logstash 输出
output.logstash:
  hosts: ["logstash:5044"]
  compression_level: 3
  bulk_max_size: 2048
  template.name: "chs-logs"
  template.pattern: "chs-*"
  template.settings:
    index.number_of_shards: 3
    index.number_of_replicas: 1

# Elasticsearch 直接输出（备用）
# output.elasticsearch:
#   hosts: ["elasticsearch:9200"]
#   index: "chs-logs-%{+yyyy.MM.dd}"
#   template.name: "chs-logs"
#   template.pattern: "chs-*"
#   template.settings:
#     index.number_of_shards: 3
#     index.number_of_replicas: 1

# Kafka 输出（可选）
# output.kafka:
#   hosts: ["kafka:9092"]
#   topic: "chs-logs"
#   partition.round_robin:
#     reachable_only: false
#   required_acks: 1
#   compression: gzip
#   max_message_bytes: 1000000

# ================================= Processors =================================
processors:
  # 添加主机信息
  - add_host_metadata:
      when.not.contains.tags: forwarded
      netinfo.enabled: false
      cache.ttl: 5m
      geo.name: "Shanghai"
      geo.location: "31.2304, 121.4737"
      geo.continent_name: "Asia"
      geo.country_iso_code: "CN"
      geo.region_name: "Shanghai"
      geo.city_name: "Shanghai"

  # 添加 Docker 元数据
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
      match_fields: ["container.id"]
      match_pids: ["process.pid", "process.ppid"]
      match_source: true
      match_source_index: 4
      match_short_id: false
      cleanup_timeout: 60
      labels.dedot: false
      env.dedot: false

  # 添加 Kubernetes 元数据
  - add_kubernetes_metadata:
      host: ${NODE_NAME}
      matchers:
      - logs_path:
          logs_path: "/var/log/containers/"
      - fields:
          lookup_fields: ["container.id"]
      default_indexers.enabled: false
      default_matchers.enabled: false
      indexers:
        - container:
      matchers:
        - fields:
            lookup_fields: ["container.id"]

  # 删除敏感信息
  - drop_fields:
      fields: ["ecs", "agent", "log.file.path"]
      ignore_missing: false

  # 重命名字段
  - rename:
      fields:
        - from: "host.name"
          to: "hostname"
      ignore_missing: false
      fail_on_error: false

  # 添加时间戳
  - timestamp:
      field: "@timestamp"
      layouts:
        - '2006-01-02T15:04:05.000Z'
        - '2006-01-02T15:04:05Z'
      test:
        - '2019-06-22T16:33:51.000Z'
        - '2019-11-18T04:59:51.123Z'

  # 脚本处理器（自定义逻辑）
  - script:
      lang: javascript
      id: chs_log_processor
      source: >
        function process(event) {
          var message = event.Get("message");
          if (message && message.includes("ERROR")) {
            event.Put("log.level", "ERROR");
            event.AppendTo("tags", "error");
          }
          if (message && message.includes("simulation_id")) {
            var match = message.match(/simulation_id=([^\s,]+)/);
            if (match) {
              event.Put("simulation.id", match[1]);
            }
          }
        }

# ================================== Logging ===================================
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
  rotateeverybytes: 10485760 # = 10MB

# ============================= X-Pack Monitoring =============================
monitoring.enabled: true
monitoring.elasticsearch:
  hosts: ["elasticsearch:9200"]
  username: "elastic"
  password: "changeme"

# ================================= Migration ==================================
migration.6_to_7.enabled: true

# ================================== HTTP Endpoint =============================
http.enabled: true
http.host: "0.0.0.0"
http.port: 5066

# ================================== Autodiscover =============================
filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      hints.default_config:
        type: container
        paths:
          - /var/lib/docker/containers/${data.docker.container.id}/*.log
      templates:
        - condition:
            contains:
              docker.container.image: "chs-api"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: chs-api
                log_type: application
              fields_under_root: false
        - condition:
            contains:
              docker.container.image: "nginx"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: nginx
                log_type: access
              fields_under_root: false

    - type: kubernetes
      node: ${NODE_NAME}
      hints.enabled: true
      hints.default_config:
        type: container
        paths:
          - /var/log/containers/*${data.kubernetes.container.id}.log
      templates:
        - condition:
            contains:
              kubernetes.labels.app: "chs-api"
          config:
            - type: container
              paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log
              fields:
                service: chs-api
                log_type: application
              fields_under_root: false
        - condition:
            contains:
              kubernetes.labels.app: "simulation-engine"
          config:
            - type: container
              paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log
              fields:
                service: simulation-engine
                log_type: application
              fields_under_root: false

# ================================== Keystore ==================================
