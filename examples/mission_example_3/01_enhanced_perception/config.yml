debug:
  enabled: true
  log_level: INFO
  print_messages: true
messaging:
  state_topic: perception/reservoir/state
scenario:
  fault_injection:
    critical_drop_time: 11
    rapid_drop_time: 10
    sensor_fault_time: 5
  normal_operation:
    water_level_decrease: 0.5
simulation:
  end_time: 20
  real_time_factor: 1.0
  start_time: 0.0
  time_step: 1.0
validation:
  checks:
  - description: 验证异常检测功能
    name: anomaly_detection
  - description: 验证预警功能
    name: predictive_warning
  - description: 验证传感器故障处理
    name: sensor_fault_handling
  enabled: true
