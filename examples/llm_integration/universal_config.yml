# LLM集成示例 - 通用配置文件
metadata:
  name: "LLM集成演示"
  description: "展示LLM智能体在系统构建、场景设计、调度指挥和数据分析中的应用，演示AI驱动的水利系统管理"
  version: "1.0"
  category: "llm_integration"
  author: "CHS-SDK Team"
  tags: ["llm", "ai", "natural_language", "intelligent_control", "automation"]

simulation:
  duration: 100
  dt: 1.0
  start_time: 0
  end_time: 100
  solver: "euler"
  
components:
  - class: Reservoir
    id: demo_reservoir
    inflow_topic: inflow/demo_reservoir
    initial_state:
      volume: 20.0
      water_level: 10.0
    parameters:
      surface_area: 2.0
      outlet_coeff: 0.7
      max_level: 15.0
      min_level: 2.0
      emergency_level: 14.0
      
  - class: Gate
    id: control_gate
    control_topic: control/control_gate
    initial_state:
      opening: 0.5
    parameters:
      max_opening: 1.0
      discharge_coeff: 0.8
      gate_width: 2.0
      response_time: 0.5
      emergency_opening: 1.0
      
  - class: RiverChannel
    id: downstream_river
    inflow_topic: inflow/downstream_river
    initial_state:
      flow_rate: 5.0
      water_depth: 2.0
    parameters:
      length: 1000.0
      width: 10.0
      slope: 0.001
      roughness: 0.03
      bank_height: 4.0
      flood_threshold: 3.5
      
  - class: WeatherStation
    id: weather_monitor
    parameters:
      location: "upstream_basin"
      monitoring_radius: 50.0
      update_interval: 5.0

connections:
  - from: demo_reservoir
    to: control_gate
    type: outlet
    parameters:
      pipe_diameter: 1.2
      pipe_length: 20.0
  - from: control_gate
    to: downstream_river
    type: flow
    parameters:
      transition_length: 50.0

agents:
  - class: LLMSystemBuilderAgent
    id: llm_builder
    parameters:
      model: "gpt-4"
      temperature: 0.3
      max_tokens: 2000
      system_prompt: "You are an expert hydraulic engineer specializing in water resource systems."
      capabilities: ["component_design", "topology_creation", "parameter_optimization"]
      
  - class: LLMScenarioDesignerAgent
    id: llm_designer
    parameters:
      model: "gpt-4"
      creativity_level: 0.7
      scenario_types: ["flood", "drought", "normal_operation", "emergency", "maintenance"]
      design_constraints:
        safety_factor: 1.5
        environmental_impact: "minimal"
        cost_optimization: true
      
  - class: LLMDispatchCommanderAgent
    id: llm_commander
    observation_topics:
      - state/demo_reservoir
      - state/control_gate
      - state/downstream_river
      - weather/weather_monitor
    action_topics:
      - control/control_gate
      - alert/system_operators
    parameters:
      model: "gpt-3.5-turbo"
      decision_interval: 10.0
      safety_constraints: true
      emergency_protocols: true
      decision_confidence_threshold: 0.8
      human_approval_required: ["emergency_actions", "major_flow_changes"]
      
  - class: LLMDataAnalystAgent
    id: llm_analyst
    observation_topics:
      - state/demo_reservoir
      - state/control_gate
      - state/downstream_river
      - performance/system_metrics
    parameters:
      model: "gpt-4"
      analysis_interval: 20.0
      report_format: "markdown"
      analysis_types: ["trend_analysis", "anomaly_detection", "performance_optimization"]
      visualization_enabled: true
      predictive_modeling: true
      
  - class: LLMMaintenanceAgent
    id: llm_maintenance
    observation_topics:
      - health/demo_reservoir
      - health/control_gate
      - performance/system_efficiency
    parameters:
      model: "gpt-3.5-turbo"
      inspection_interval: 50.0
      maintenance_scheduling: true
      failure_prediction: true
      
  - class: InflowAgent
    id: inflow_generator
    action_topic: inflow/demo_reservoir
    parameters:
      pattern: "weather_driven"
      base_value: 6.0
      variation: 2.0
      weather_correlation: 0.8
      
  - class: MonitoringAgent
    id: system_monitor
    observation_topics:
      - state/demo_reservoir
      - state/control_gate
      - state/downstream_river
    parameters:
      monitoring_interval: 5.0
      data_quality_check: true
      alert_thresholds:
        reservoir_level: {min: 3.0, max: 14.0}
        river_flow: {min: 1.0, max: 20.0}

output:
  show_progress: true
  show_final_summary: true
  log_level: "INFO"
  save_history: true
  export_format: ["csv", "json", "pdf_report"]
  plot_results: true
  
llm_config:
  api_key_env: "OPENAI_API_KEY"
  timeout: 30
  retry_attempts: 3
  rate_limit: 60  # requests per minute
  fallback_model: "gpt-3.5-turbo"
  cost_tracking: true
  response_caching: true
  safety_filters: true
  
visualization:
  enabled: true
  real_time: false
  save_plots: true
  plot_types: ["time_series", "decision_tree", "llm_reasoning"]
  dashboard_enabled: true
  
performance:
  metrics: ["decision_accuracy", "response_time", "cost_efficiency", "safety_compliance"]
  analysis_enabled: true
  llm_performance_tracking: true
  
validation:
  enabled: true
  llm_output_validation: true
  safety_constraint_check: true
  decision_audit_trail: true
  
security:
  data_encryption: true
  access_control: true
  audit_logging: true
  sensitive_data_masking: true