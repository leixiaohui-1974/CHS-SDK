# LLM集成示例配置文件
# 传统配置文件模式

simulation:
  duration: 100
  dt: 1.0
  solver: 'euler'

components:
  demo_reservoir:
    class: Reservoir
    inflow_topic: inflow/demo_reservoir
    initial_state:
      volume: 20.0
      water_level: 10.0
    parameters:
      surface_area: 2.0
      outlet_coeff: 0.7
      
  control_gate:
    class: Gate
    control_topic: control/control_gate
    initial_state:
      opening: 0.5
    parameters:
      max_opening: 1.0
      discharge_coeff: 0.8
      gate_width: 2.0
      
  downstream_river:
    class: RiverChannel
    inflow_topic: inflow/downstream_river
    initial_state:
      flow_rate: 5.0
    parameters:
      length: 1000.0
      width: 10.0
      roughness: 0.025
      slope: 0.001

connections:
  - from: demo_reservoir
    to: control_gate
    type: outlet
  - from: control_gate
    to: downstream_river
    type: inflow

llm_agents:
  system_builder_agent:
    type: SystemBuilderAgent
    model: gpt-4
    capabilities:
      - component_selection
      - parameter_optimization
      - topology_design
    knowledge_base: hydraulic_systems
    
  scenario_designer_agent:
    type: ScenarioDesignerAgent
    model: gpt-4
    capabilities:
      - scenario_generation
      - disturbance_design
      - test_case_creation
    domain_expertise: water_management
    
  dispatch_commander_agent:
    type: DispatchCommanderAgent
    model: gpt-4
    capabilities:
      - real_time_decision
      - emergency_response
      - resource_allocation
    response_time: 1.0
    
  data_analyst_agent:
    type: DataAnalystAgent
    model: gpt-4
    capabilities:
      - pattern_recognition
      - performance_analysis
      - report_generation
    analysis_frequency: 10.0

control:
  llm_enhanced_controller:
    target_variable: demo_reservoir.water_level
    control_variable: control_gate.opening
    base_controller: pid
    llm_advisor: dispatch_commander_agent
    setpoint: 12.0
    kp: 0.5
    ki: 0.1
    kd: 0.05
    output_limits: [0.0, 1.0]
    llm_intervention_threshold: 0.5

inflow:
  demo_reservoir:
    type: llm_generated
    agent: scenario_designer_agent
    base_pattern: step
    value: 8.0
    start_time: 30
    end_time: 70
    llm_modifications: true

llm_integration:
  system_building:
    enabled: true
    agent: system_builder_agent
    auto_optimize: true
    optimization_criteria: [efficiency, stability, cost]
    
  scenario_design:
    enabled: true
    agent: scenario_designer_agent
    adaptive_scenarios: true
    complexity_level: medium
    
  dispatch_command:
    enabled: true
    agent: dispatch_commander_agent
    real_time_mode: true
    decision_frequency: 5.0
    
  data_analysis:
    enabled: true
    agent: data_analyst_agent
    continuous_monitoring: true
    report_interval: 20.0

output:
  variables:
    - demo_reservoir.water_level
    - demo_reservoir.volume
    - control_gate.opening
    - control_gate.outflow
    - downstream_river.flow_rate
  llm_outputs:
    - system_builder_agent.recommendations
    - scenario_designer_agent.scenarios
    - dispatch_commander_agent.decisions
    - data_analyst_agent.insights
  save_to_file: true
  plot: true
  llm_logs: true