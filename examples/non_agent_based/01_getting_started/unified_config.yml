analysis:
  performance_metrics:
    overshoot_threshold: 10
    settling_time_threshold: 300
    settling_tolerance: 0.01
    steady_state_error_threshold: 0.02
    rmse_threshold: 0.05
    max_deviation_threshold: 0.05
  visualization:
    enabled: true
    output_file: 01_getting_started_results.png
    plots:
    - title: PID Control of Reservoir Water Level
      type: water_level
    - title: PID Controller Output (Gate Opening)
      type: gate_opening
components:
  gate_1:
    initial_state:
      opening: 0.35
    parameters:
      discharge_coefficient: 0.6
      max_rate_of_change: 0.25
      width: 7
    type: Gate
  reservoir_1:
    initial_state:
      volume: 140000
      water_level: 14.0
    parameters:
      storage_curve:
      - - 0
        - 0
      - - 200000
        - 20
      surface_area: 10000
      inflow: 65.0
    type: Reservoir
connections:
- from: reservoir_1
  to: gate_1
controllers:
  pid_controller_1:
    controlled_component: gate_1
    observation_key: water_level
    observed_component: reservoir_1
    parameters:
      Kd: -0.12
      Ki: -0.015
      Kp: -1.0
      max_output: 1.0
      min_output: 0.0
      setpoint: 12.0
    type: PIDController
metadata:
  category: non_agent_based
  description: 统一配置文件，用于 non_agent_based/01_getting_started 示例
  name: 01_getting_started - 统一配置
  version: '1.0'
simulation:
  dt: 1.0
  duration: 600
  time_step: 1.0
