actuator_disturbance:
  enable: true
  gate_actuators:
    Gate_1:
      aging_factor: 0.95
      backlash: 0.005
      delay: 2.0
      noise_std: 0.02
      stiction_threshold: 0.01
    Gate_2:
      aging_factor: 0.97
      backlash: 0.003
      delay: 1.5
      noise_std: 0.015
      stiction_threshold: 0.008
    Gate_3:
      aging_factor: 0.96
      backlash: 0.004
      delay: 1.8
      noise_std: 0.018
      stiction_threshold: 0.009
agents_file: agents.yml
architecture:
  communication:
    broker_config:
      host: localhost
      keepalive: 60
      port: 1883
    protocol: MQTT
    topic_structure:
      agent_data: agent.{agent_id}.{data_category}
      control_commands: control/{component_id}/{command_type}
      disturbance_data: disturbance/{disturbance_type}/{target_component}
      simulation_data: simulation/{component_type}/{component_id}/{data_type}
  layers:
  - agents:
    - ontology_simulation
    description: 物理本体仿真层，统一仿真所有物理实体
    name: Physical_Entity_Simulation_Layer
  - agents:
    - Channel1_Twin_Agent
    - Channel2_Twin_Agent
    - Gate1_Perception_Agent
    - Gate2_Perception_Agent
    - Gate3_Perception_Agent
    description: 分布式数字孪生与感知层
    name: Distributed_Perception_Layer
  - agents:
    - Gate1_Control_Agent
    - Gate2_Control_Agent
    - Gate3_Control_Agent
    description: 本地控制层
    name: Local_Control_Layer
  - agents:
    - central_perception
    - central_mpc
    description: 中心感知与优化协调层
    name: Central_Coordination_Layer
  - agents:
    - Rainfall_Agent
    - Water_Use_Agent
    description: 扰动智能体层
    name: Disturbance_Layer
components_file: components.yml
control_system:
  central_mpc:
    constraints:
      flow_rates:
        Gate_1:
        - 0.0
        - 200.0
        Gate_2:
        - 0.0
        - 150.0
        Gate_3:
        - 0.0
        - 100.0
      gate_openings:
        all_gates:
        - 0.0
        - 1.0
      rate_limits:
        max_opening_rate: 0.1
      water_levels:
        Gate_1_upstream:
        - 5.0
        - 20.0
        Gate_2_upstream:
        - 3.0
        - 15.0
        Gate_3_upstream:
        - 2.0
        - 12.0
    control_horizon: 900.0
    objective_weights:
      actuator_smoothness: 0.5
      energy_efficiency: 0.3
      flow_regulation: 0.8
      water_level_tracking: 1.0
    optimization_interval: 300.0
    prediction_horizon: 1800.0
    solver: ipopt
  local_controllers:
    Gate_1:
      constraints:
        max_opening_rate: 0.1
        output_limits:
        - -0.1
        - 0.1
      controller_type: PID
      parameters:
        kd: 0.1
        ki: 0.5
        kp: 2.0
    Gate_2:
      constraints:
        max_opening_rate: 0.08
        output_limits:
        - -0.08
        - 0.08
      controller_type: PID
      parameters:
        kd: 0.08
        ki: 0.4
        kp: 1.8
    Gate_3:
      constraints:
        max_opening_rate: 0.06
        output_limits:
        - -0.06
        - 0.06
      controller_type: PID
      parameters:
        kd: 0.06
        ki: 0.3
        kp: 1.5
data_logging:
  data_types:
  - water_levels
  - flow_rates
  - gate_openings
  - control_commands
  - identification_results
  - mpc_optimization_results
  - disturbance_data
  - performance_metrics
  enable: true
  logging_frequency:
    high_frequency: 60.0
    low_frequency: 900.0
    medium_frequency: 300.0
  output_directory: ./simulation_results
  output_formats:
  - csv
  - hdf5
  - json
digital_twin:
  channel_models:
    Channel_1:
      identification:
        enable: true
        method: RLS
        update_frequency: 60.0
      initial_parameters:
        integral_coefficient: 0.8
        time_delay: 300.0
      model_type: IntegralDelayModel
    Channel_2:
      identification:
        enable: true
        method: RLS
        update_frequency: 60.0
      initial_parameters:
        integral_coefficient: 0.75
        time_delay: 240.0
      model_type: IntegralDelayModel
  gate_identification:
    Gate_1:
      bounds:
      - 0.5
      - 1.2
      initial_value: 0.8
      parameter: comprehensive_discharge_coefficient
      rls_config:
        forgetting_factor: 0.95
        initial_covariance: 500.0
    Gate_2:
      bounds:
      - 0.5
      - 1.0
      initial_value: 0.75
      parameter: discharge_coefficient
      rls_config:
        forgetting_factor: 0.95
        initial_covariance: 500.0
    Gate_3:
      bounds:
      - 0.4
      - 0.9
      initial_value: 0.7
      parameter: discharge_coefficient
      rls_config:
        forgetting_factor: 0.95
        initial_covariance: 500.0
disturbances:
  rainfall:
    base_intensity: 5.0
    enable: true
    forecast_horizon: 7200.0
    random_std: 2.0
    storm_probability: 0.05
  water_demand:
    base_demands:
      Diversion_1: 15.0
      Diversion_2: 12.0
    daily_variation: 0.5
    enable: true
    forecast_horizon: 10800.0
    random_std: 0.1
flow_allocation:
  single_gate_strategy:
    allocation_method: direct_control
    file_path: input/gate_flow_allocation_1gate.csv
    safety_margin: 0.05
  three_gate_strategy:
    allocation_method: sequential_priority
    balancing_threshold: 0.1
    file_path: input/gate_flow_allocation_3gates.csv
    priority_order:
    - 1
    - 2
    - 3
monitoring:
  comprehensive_monitoring:
    enable: true
    flow_monitoring:
    - component: Gate_1
      measurement_type: total_flow
      noise_config:
        bias: 0.5
        distribution: normal
        enable: true
        std_dev: 3.0
    - component: Gate_2
      measurement_type: flow
      noise_config:
        bias: 0.3
        distribution: normal
        enable: true
        std_dev: 2.0
    - component: Gate_3
      measurement_type: flow
      noise_config:
        bias: 0.2
        distribution: normal
        enable: true
        std_dev: 1.5
    - component: Diversion_1
      measurement_type: outflow
      noise_config:
        bias: 0.1
        distribution: normal
        enable: true
        std_dev: 1.0
    - component: Diversion_2
      measurement_type: outflow
      noise_config:
        bias: 0.08
        distribution: normal
        enable: true
        std_dev: 0.8
    frequency: 60.0
    rainfall_monitoring:
    - component: Channel_1
      noise_config:
        bias: 0.1
        distribution: normal
        enable: true
        std_dev: 0.5
    - component: Channel_2
      noise_config:
        bias: 0.08
        distribution: normal
        enable: true
        std_dev: 0.4
    water_level_monitoring:
    - component: Gate_1
      locations:
      - upstream
      - downstream
      noise_config:
        bias: 0.01
        distribution: normal
        enable: true
        std_dev: 0.03
    - component: Gate_2
      locations:
      - upstream
      - downstream
      noise_config:
        bias: 0.008
        distribution: normal
        enable: true
        std_dev: 0.025
    - component: Gate_3
      locations:
      - upstream
      - downstream
      noise_config:
        bias: 0.005
        distribution: normal
        enable: true
        std_dev: 0.02
performance_monitoring:
  alert_thresholds:
    control_saturation: 0.9
    flow_rate_error: 0.1
    identification_error: 0.15
    water_level_deviation: 0.2
  enable: true
  metrics:
  - control_performance
  - prediction_accuracy
  - identification_convergence
  - system_stability
  - computational_efficiency
simulation:
  description: 完全分布式、高保真的数字孪生与优化控制仿真案例
  end_time: 86400.0
  name: Distributed_Digital_Twin_Simulation
  parallel_config:
    enable: true
    load_balancing: dynamic
    num_threads: 8
  real_time_factor: 1.0
  solver_config:
    max_step_size: 60.0
    min_step_size: 1.0
    tolerance: 1e-6
    type: adaptive_runge_kutta
  start_time: 0.0
  time_step: 60.0
  version: 1.0.0
topology_file: topology.yml
validation:
  enable: true
  performance_criteria:
    control_effort: 0.8
    flow_tracking_error: 0.05
    stability_margin: 0.2
    water_level_rmse: 0.1
  test_scenarios:
  - disturbances:
    - light_rain
    - normal_demand
    duration: 7200.0
    name: normal_operation
  - disturbances:
    - heavy_rain
    - high_demand
    duration: 3600.0
    name: storm_event
  - disturbances:
    - actuator_fault
    - sensor_noise
    duration: 1800.0
    name: equipment_failure
visualization:
  dashboard_config:
    auto_refresh: true
    port: 8080
    update_frequency: 30.0
  enable: true
  real_time_plots:
  - system_overview
  - water_levels
  - flow_rates
  - control_actions
  - mpc_predictions
