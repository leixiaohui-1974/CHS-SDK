# 引绰济辽工程仿真配置常量
# 用于消除硬编码，提升可维护性

# 仿真时间参数
simulation_time:
  duration_hours: 168.0  # 7天仿真时长
  time_step_hours: 1.0   # 1小时时间步长
  start_time: 0.0        # 仿真开始时间

# PID控制器参数
pid_controllers:
  # 套河闸门控制参数
  taoriver_gate:
    Kp: -0.1
    Ki: -0.01
    Kd: -0.05
    setpoint_m: 324.20  # 目标水位（米）
    min_output: 0.0
    max_output: 1.0
  
  # 归柳闸门控制参数  
  guiliu_gate:
    Kp: -0.1
    Ki: -0.01
    Kd: -0.05
    setpoint_m: 320.38  # 目标水位（米）
    min_output: 0.0
    max_output: 1.0
  
  # 在线阀门控制参数
  online_valve:
    Kp: 0.2
    Ki: 0.02
    Kd: 0.1
    setpoint_pressure: 0.65  # 目标压力（MPa）
    min_output: 0.0
    max_output: 1.0
  
  # 末端阀门控制参数
  terminal_valve:
    Kp: -0.05
    Ki: -0.005
    Kd: -0.02
    setpoint_m: 212.5  # 目标水位（米）
    min_output: 0.0
    max_output: 1.0
  
  # 进水闸门控制参数
  intake_gate:
    Kp: -0.1
    Ki: -0.01
    Kd: -0.05
    setpoint_m: 349.5  # 目标水位（米）
    min_output: 0.0
    max_output: 1.0

# 应急处理参数
emergency_control:
  pressure_threshold_mpa: 0.3  # 压力阈值（MPa）
  monitored_pipes:
    - state/pipe_1
    - state/pipe_2
  action_topic: control/water_intake_gate

# 中央调度参数
central_dispatcher:
  terminal_pool:
    low_level_m: 212.0   # 末端池低水位阈值（米）
    high_level_m: 213.0  # 末端池高水位阈值（米）
  intake_setpoints:
    low_setpoint_m: 349.8   # 低水位时的进水闸目标（米）
    high_setpoint_m: 349.2  # 高水位时的进水闸目标（米）
  
# 数据输入参数
data_input:
  csv_inflow:
    target_component: wendegen_reservoir
    file_path: data/historical_inflow.csv
    time_column: time
    data_column: inflow

# 物理模型参数常量
physical_constants:
  gate_default_width_m: 10.0          # 闸门默认宽度（米）
  gate_default_discharge_coeff: 0.6   # 闸门默认流量系数
  gate_default_max_opening_m: 2.0     # 闸门默认最大开度（米）
  gate_default_max_rate_change: 0.1   # 闸门默认最大变化率（米/秒）
  
  valve_default_max_flow: 100.0       # 阀门默认最大流量（m³/s）
  valve_default_cv_coeff: 10.0        # 阀门默认流量系数

# 测试参数
test_scenarios:
  pipe_burst:
    trigger_time_hours: 100.0  # 管道爆裂测试触发时间（小时）
    target_pipe: pipe_1        # 目标管道
    burst_pressure_mpa: 0.1    # 爆裂后压力（MPa）