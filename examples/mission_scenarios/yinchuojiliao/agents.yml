# Defines all agents in the simulation
# Note: The loader will be responsible for creating the shared message_bus
# and injecting it into agents that require it.
#
# CONFIGURATION CONSTANTS REFERENCE:
# All hardcoded values have been replaced with references to config_constants.yml
# This file should be used in conjunction with config_constants.yml to avoid magic numbers
# For dynamic loading, implement a configuration loader that merges these files

# Simple controllers that are wired directly by the harness
controllers:
  - id: taoriver_ctrl
    class: PIDController
    controlled_id: taoriver_gate
    observed_id: tunnel_1
    observation_key: water_level
    config:
      # 引用config_constants.yml -> pid_controllers.taoriver_gate
      Kp: ${config_constants.pid_controllers.taoriver_gate.Kp}  # -0.1
      Ki: ${config_constants.pid_controllers.taoriver_gate.Ki}  # -0.01
      Kd: ${config_constants.pid_controllers.taoriver_gate.Kd}  # -0.05
      setpoint: ${config_constants.pid_controllers.taoriver_gate.setpoint_m}  # 324.20
      min_output: ${config_constants.pid_controllers.taoriver_gate.min_output}  # 0
      max_output: ${config_constants.pid_controllers.taoriver_gate.max_output}  # 1

  - id: guiliu_ctrl
    class: PIDController
    controlled_id: guiliu_gate
    observed_id: tunnel_2
    observation_key: water_level
    config:
      # 引用config_constants.yml -> pid_controllers.guiliu_gate
      Kp: ${config_constants.pid_controllers.guiliu_gate.Kp}  # -0.1
      Ki: ${config_constants.pid_controllers.guiliu_gate.Ki}  # -0.01
      Kd: ${config_constants.pid_controllers.guiliu_gate.Kd}  # -0.05
      setpoint: ${config_constants.pid_controllers.guiliu_gate.setpoint_m}  # 320.38
      min_output: ${config_constants.pid_controllers.guiliu_gate.min_output}  # 0
      max_output: ${config_constants.pid_controllers.guiliu_gate.max_output}  # 1

  - id: online_valve_ctrl
    class: PIDController
    controlled_id: online_valve
    observed_id: pipe_2
    observation_key: pressure
    config:
      # 引用config_constants.yml -> pid_controllers.online_valve
      Kp: ${config_constants.pid_controllers.online_valve.Kp}  # 0.2
      Ki: ${config_constants.pid_controllers.online_valve.Ki}  # 0.02
      Kd: ${config_constants.pid_controllers.online_valve.Kd}  # 0.1
      setpoint: ${config_constants.pid_controllers.online_valve.setpoint_pressure}  # 0.65
      min_output: ${config_constants.pid_controllers.online_valve.min_output}  # 0
      max_output: ${config_constants.pid_controllers.online_valve.max_output}  # 1

  - id: terminal_valve_ctrl
    class: PIDController
    controlled_id: terminal_valve
    observed_id: terminal_pool
    observation_key: water_level
    config:
      # 引用config_constants.yml -> pid_controllers.terminal_valve
      Kp: ${config_constants.pid_controllers.terminal_valve.Kp}  # -0.05
      Ki: ${config_constants.pid_controllers.terminal_valve.Ki}  # -0.005
      Kd: ${config_constants.pid_controllers.terminal_valve.Kd}  # -0.02
      setpoint: ${config_constants.pid_controllers.terminal_valve.setpoint_m}  # 212.5
      min_output: ${config_constants.pid_controllers.terminal_valve.min_output}  # 0
      max_output: ${config_constants.pid_controllers.terminal_valve.max_output}  # 1

  - id: intake_gate_ctrl
    class: PIDController
    controlled_id: water_intake_gate
    observed_id: tunnel_1
    observation_key: water_level
    config:
      # 引用config_constants.yml -> pid_controllers.intake_gate
      Kp: ${config_constants.pid_controllers.intake_gate.Kp}  # -0.1
      Ki: ${config_constants.pid_controllers.intake_gate.Ki}  # -0.01
      Kd: ${config_constants.pid_controllers.intake_gate.Kd}  # -0.05
      setpoint: ${config_constants.pid_controllers.intake_gate.setpoint_m}  # 349.5
      min_output: ${config_constants.pid_controllers.intake_gate.min_output}  # 0
      max_output: ${config_constants.pid_controllers.intake_gate.max_output}  # 1

# Agents that run in the main MAS loop
agents:
  # Perception layer: Create a digital twin for every physical component
  - id: twin_wendegen_reservoir
    class: DigitalTwinAgent
    config:
      simulated_object_id: wendegen_reservoir
      state_topic: state/wendegen_reservoir
  - id: twin_water_intake_gate
    class: DigitalTwinAgent
    config:
      simulated_object_id: water_intake_gate
      state_topic: state/water_intake_gate
  - id: twin_tunnel_1
    class: DigitalTwinAgent
    config:
      simulated_object_id: tunnel_1
      state_topic: state/tunnel_1
  - id: twin_taoriver_gate
    class: DigitalTwinAgent
    config:
      simulated_object_id: taoriver_gate
      state_topic: state/taoriver_gate
  - id: twin_tunnel_2
    class: DigitalTwinAgent
    config:
      simulated_object_id: tunnel_2
      state_topic: state/tunnel_2
  - id: twin_guiliu_gate
    class: DigitalTwinAgent
    config:
      simulated_object_id: guiliu_gate
      state_topic: state/guiliu_gate
  - id: twin_tunnel_3
    class: DigitalTwinAgent
    config:
      simulated_object_id: tunnel_3
      state_topic: state/tunnel_3
  - id: twin_connection_pool
    class: DigitalTwinAgent
    config:
      simulated_object_id: connection_pool
      state_topic: state/connection_pool
  - id: twin_pipe_1
    class: DigitalTwinAgent
    config:
      simulated_object_id: pipe_1
      state_topic: state/pipe_1
  - id: twin_online_valve
    class: DigitalTwinAgent
    config:
      simulated_object_id: online_valve
      state_topic: state/online_valve
  - id: twin_pipe_2
    class: DigitalTwinAgent
    config:
      simulated_object_id: pipe_2
      state_topic: state/pipe_2
  - id: twin_terminal_valve
    class: DigitalTwinAgent
    config:
      simulated_object_id: terminal_valve
      state_topic: state/terminal_valve
  - id: twin_terminal_pool
    class: DigitalTwinAgent
    config:
      simulated_object_id: terminal_pool
      state_topic: state/terminal_pool

  # Supervisory and Emergency Layer
  - id: emergency_agent
    class: EmergencyAgent
    config:
      # 引用config_constants.yml -> emergency_control.monitored_pipes
      subscribed_topics:
        - state/pipe_1  # ${config_constants.emergency_control.monitored_pipes[0]}
        - state/pipe_2  # ${config_constants.emergency_control.monitored_pipes[1]}
      pressure_threshold: ${config_constants.emergency_control.pressure_threshold_mpa}  # 0.3
      action_topic: ${config_constants.emergency_control.action_topic}  # control/water_intake_gate

  - id: central_dispatcher
    class: CentralDispatcherAgent
    config:
      mode: rule
      subscribed_topic: state/terminal_pool
      observation_key: water_level
      command_topic: command/intake_gate_ctrl
      dispatcher_params:
        # 引用config_constants.yml -> central_dispatcher
        low_level: ${config_constants.central_dispatcher.terminal_pool.low_level_m}  # 212.0
        high_level: ${config_constants.central_dispatcher.terminal_pool.high_level_m}  # 213.0
        low_setpoint: ${config_constants.central_dispatcher.intake_setpoints.low_setpoint_m}  # 349.8
        high_setpoint: ${config_constants.central_dispatcher.intake_setpoints.high_setpoint_m}  # 349.2

  # Data Input Layer
  - id: csv_inflow
    class: CsvInflowAgent
    config:
      # 引用config_constants.yml -> data_input.csv_inflow
      target_component_id: ${config_constants.data_input.csv_inflow.target_component}  # wendegen_reservoir
      # Path is relative to the scenario directory
      csv_file: ${config_constants.data_input.csv_inflow.file_path}  # data/historical_inflow.csv
      time_column: ${config_constants.data_input.csv_inflow.time_column}  # time
      data_column: ${config_constants.data_input.csv_inflow.data_column}  # inflow
