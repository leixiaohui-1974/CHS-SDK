# Agents for centralized emergency override scenario
agents:
  - id: reservoir_twin
    class: core_lib.local_agents.perception.digital_twin_agent.DigitalTwinAgent
    config:
      simulated_object_id: main_reservoir
      state_topic: "state/reservoir/main"

  - id: gate_follower
    class: core_lib.local_agents.control.local_control_agent.LocalControlAgent
    config:
      target_component: flood_gate
      control_type: direct_gate_control
      data_sources:
        primary_data: "state/reservoir/main"
      control_targets:
        primary_target: "action/gate/flood"
      controller:
        class: core_lib.local_agents.control.custom_controllers.DirectGateController
        config:
          setpoint: 0.12
      observation_topic: "state/reservoir/main"
      observation_key: water_level
      action_topic: "action/gate/flood"
      command_topic: "command/gate/flood"

  - id: central_dispatcher
    class: core_lib.central_coordination.dispatch.central_dispatcher.CentralDispatcherAgent
    config:
      mode: rule
      subscribed_topic: "state/reservoir/main"
      observation_key: water_level
      command_topic: "command/gate/flood"
      dispatcher_params:
        low_level: 98.9
        high_level: 99.1
        high_setpoint: 0.12
        low_setpoint: 1.0
