agents:
  control_agent_gate_1:
    agent_id: control_agent_gate_1
    controller:
      parameters:
        Kd: 0.0
        Ki: 0.5
        Kp: 5.0
        filter_constant: 0.1
        max_output: 1.0
        min_output: 0.0
        setpoint: 13.9
        windup_limit: 0.5
      type: SmartPIDController
    message_bus:
      action_topic: action.gate.opening
      observation_key: water_level
      observation_topic: state.reservoir.level
    type: UnifiedGateControlAgent
  twin_agent_reservoir_1:
    agent_id: twin_agent_reservoir_1
    message_bus:
      state_topic: state.reservoir.level
    simulated_object: reservoir_1
    type: DigitalTwinAgent
analysis:
  final_state_report: true
  target_water_level: 13.9
communication:
  topics:
    control_actions: control_cmds
    digital_twin_state: dt_state
    gate_action: action.gate.opening
    reservoir_state: state.reservoir.level
    sensor_data: sensor_readings
components:
  gate_1:
    initial_state:
      opening: 0.1
    message_bus:
      action_topic: action.gate.opening
      enabled: true
    parameters:
      discharge_coefficient: 0.6
      max_opening: 1.0
      max_rate_of_change: 0.5
      width: 10
    type: Gate
  reservoir_1:
    initial_state:
      volume: 21000000
      water_level: 14.0
    parameters:
      storage_curve:
      - - 0
        - 0
      - - 21000000
        - 14.0
      - - 30000000
        - 20
      surface_area: 1500000
    type: Reservoir
connections:
- from: reservoir_1
  to: gate_1
debug:
  enabled: true
  log_interval: 5
simulation:
  end_time: 1800.0
  real_time_factor: 1.0
  start_time: 0.0
  time_step: 30.0
visualization:
  enabled: true
  plots:
  - target_line: 13.9
    title: Reservoir Water Level vs Time
    x_data: time
    y_data: reservoir_water_level
    ylabel: Water Level (m)
  - title: Gate Opening vs Time
    x_data: time
    y_data: gate_opening
    ylabel: Gate Opening (0-1)
  - title: Reservoir Volume vs Time
    x_data: time
    y_data: reservoir_volume
    ylabel: Volume (m³)
  save_path: 03_mas_results.png
