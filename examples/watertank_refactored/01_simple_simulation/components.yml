# This file defines the physical components for the simple simulation scenario.
components:
  - id: reservoir_1
    class: core_lib.physical_objects.reservoir.Reservoir
    # The 'name', 'initial_state', and 'parameters' are direct arguments
    # to the Reservoir's constructor.
    name: "simple_tank"
    initial_state:
      water_level: 2.0
    parameters:
      surface_area: 10.0
      # The topic subscription is also a parameter for the new flexible Reservoir
      inflow_topics:
        - topic: inflow_topic
          key: value # The CsvInflowAgent now publishes a dict with a 'value' key
