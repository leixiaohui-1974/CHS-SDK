  # 明渠段1 
  - id: Channel_1
    class: UnifiedCanal
    initial_state:  
      water_level: 61.90   # 初始水位 (m)
      volume: 800000     # 初始水量 (m³)   /////////
      inflow: 25.0       # 初始入流 (m³/s) - 必需字段
      outflow: 25.0      # 初始出流 (m³/s) - 必需字段
    parameters:
      model_type: integral_delay         ### 特有参数    根据 `model_type` 不同而变化：integral、integral_delay、integral_delay_zero、linear_reservoir、st_venant
      length: 2911      # 渠道长度 (必需)       model_type= st_venant时必填。
      num_points: 2          #计算点数（必需）   一段渠道则填2，两段渠道则填3，以此类推，点数越多，模拟精度通常越高，但计算复杂度也会增加。  model_type= st_venant时必填。
      bottom_width: 15       #底部宽度 当渠道为梯形断面时用，需同时填写side_slope_z边坡系数。（必需）    model_type= st_venant时必填。
      side_slope_z: 0      #边坡系数（必需）     model_type= st_venant时必填。
      manning_n: 0.015        # 曼宁系数（必需）       nc: 0.015 （王老师） model_type= st_venant时必填。
      initial_H: [61.90, 61.90]       # 初始水位数组（根据计算节点划分的渠段数填写，长度须和num_points保持一致。）   model_type= st_venant时选填。
      initial_Q: [10.0, 10.0]           # 初始流量数组（根据计算节点划分的渠段数填写，长度须和num_points保持一致.）    model_type= st_venant时选填。
      gain: 0.001                   #增益，默认 0.001    model_type= integral_delay、integral_delay_zero时必填。
      delay: 300                 #延迟，默认 300        model_type= integral_delay、integral_delay_zero时必填。
      zero_time_constant:       #零点时间常数，默认 50       model_type= integral_delay_zero时必填。
      surface_area: 10000.0            #表面面积，默认 10000.0      model_type= integral时必填。
      outlet_coefficient: 5   #出口系数，默认 5.0      model_type= integral时必填。
      slope: 0.001              #坡度    model_type= st_venant时必填。
      storage_constant: 1200         #存储常数，默认 1200    model_type=linear_reservoir时必填。
      level_storage_ratio: 0.005      #水位存储比，默认 0.005  model_type=linear_reservoir必填。

      # 监测点噪声配置
      water_level_noise_std: 0.05  # 水位监测噪声 (m)  /////////
      flow_noise_std: 2.0          # 流量监测噪声 (m³/s) ///////
