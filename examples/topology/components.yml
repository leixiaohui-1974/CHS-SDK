    #倒虹吸1
  
  - id: Pipe_1
    class: Pipe
    initial_state:
      outflow: 10       # 初始流量 (m³/s)，可选，默认为0
      head_loss: 0     # 初始水头损失 (m)，可选，默认为0
    parameters:
      calculation_method: darcy_weisbach  # 计算方法，可选'darcy_weisbach'或'manning'，默认'darcy_weisbach'
      length: 490    # 管道长度 (m)     l_orifice: 490.0 （王老师）
      diameter: 7.778    # 管道直径 (m)
      friction_factor: 0.02  # 摩擦系数，当使用darcy_weisbach方法时必需
      manning_n: 0.015 # # 曼宁系数，当使用manning方法时必需    /////////  nc: 0.015  （王老师）
      flow_noise_std: 1.0     # 流量监测噪声////////
      inlet_zb: 55.674    #进口底高程  （王老师）
      inlet_b: 11.0       #进口底宽  （王老师）
      inlet_m: 0.0        #进口边坡系数  （王老师）
      outlet_zb: 55.764   #出口底高程  （王老师）
      outlet_b: 11.0      #出口底宽  （王老师）
      outlet_m: 0.0       #出口边坡系数  （王老师）
      n_orifice: 2.0      #孔数  （王老师）
      b_orifice: 5.5      #单孔宽度  （王老师）
      h_orifice: 5.5      #单孔高度  （王老师）
      
      loss_coeff: 1.0     #损失系数  （王老师）  雷老师  head_loss 默认0。
      loc_x: 625870.2395257393  # 经度  （王老师）
      loc_y: 4358942.71982015     # 纬度  （王老师）
                     
  # 节制闸1 (2孔闸门)
  - id: Gate_1
    class: Gate
    initial_state:
      opening: 0.5       # 初始开度 (0-1)   单位不同，雷老师是百分比，需要补充闸门高度；王老师是闸门高度，单位m，会超1
    parameters:
      max_rate_of_change: 0.1    # 最大开度变化率 (0-1)  ////////
      max_opening: 1.0          # 最大开度 (0-1)  ////////
      width: 11        # 闸门总宽度 (m)   b: 5.5  #单孔闸门底宽  （王老师） 注意：王老师b为单孔底宽，雷老师width为总宽度
      discharge_coefficient: 0.7919242  # 流量系数  c3: 0.7919242 （王老师）
      number_of_gates: 2 # 2个独立闸孔

      # 执行器干扰配置
      actuator_delay: 2.0     # 执行器延迟 (s)  /////////
      actuator_noise_std: 0.02 # 执行器噪声标准差 /////////
      mechanical_aging: 0.95   # 机械老化系数    /////////

      zb: 55.764    #底高程     （王老师） 
      type: 2       #闸门模拟类型：1）离散流态分段系数法 2）连续动态拟合系数法 3）无量纲普适公式法   (王老师)
      c1: 0.0      #当type=1时，c1为自由孔流;当type=2时，c1为一次项系数；当type=3时，c1为开度线性影响系数。(王老师)
      c2: 0.0      #当type=1时，c2为自由堰流;当type=2时，c2为二次项系数；当type=3时，c2为基准流量系数。(王老师)
      c3: 0.7919242   #当type=1时，c3为淹没孔流;当type=2时，c3为常数项；当type=3时，无c3。(王老师)
      c4: 0.0      #当type=1时，c4为淹没堰流;当type=2时，无c4；当type=3时，无c4。(王老师)
      down_zb: 0.0    #下游断面底高程  （王老师）
      down_b: 0.0     #下游断面底宽  （王老师）
      down_m: 0.0     #下游断面边坡系数  （王老师）
      loc_x: 625974.277169082  # 经度  （王老师）
      loc_y: 4359258.965897897      # 纬度  （王老师）

