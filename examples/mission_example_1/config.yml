canal:
  initial_state:
    flow_rate: 10.0
    inflow: 10.0
    outflow: 10.0
    volume: 20000.0
    water_level: 2.0
  name: canal_1
  parameters:
    bottom_width: 20.0
    delay: 300
    gain: 0.001
    length: 1000.0
    manning_coefficient: 0.025
    model_type: integral_delay
    side_slope_z: 1.0
debug:
  data_collection_interval: 5.0
  enable_data_collection: true
  enable_performance_monitoring: true
  log_file: logs/mission_example_1.log
  log_level: INFO
  session_id: mission_example_1
gate:
  initial_state:
    flow_rate: 0.0
    opening: 0.5
  name: gate_1
  parameters:
    discharge_coefficient: 0.6
    max_opening: 1.0
    max_rate_of_change: 0.1
    width: 10.0
output:
  output_directory: results/
  plot_results: true
  save_plots: true
  save_results: true
  validation:
    check_outflow_response: true
    check_water_level_response: true
    enable: true
  variables_to_plot:
  - canal_water_level
  - gate_outflow
  - inflow_rate
scenario:
  gate_operations:
  - new_opening: 0.8
    time: 30.0
  - new_opening: 0.3
    time: 70.0
  inflow_changes:
  - new_inflow: 15.0
    time: 50.0
simulation:
  description: 演示纯物理组件（渠道和闸门）动态行为的示例
  end_time: 100.0
  output_interval: 5.0
  real_time_factor: 1.0
  start_time: 0.0
  time_step: 1.0
